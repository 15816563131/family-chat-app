<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭聊天 - v2.0.0</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#07c160">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="家庭聊天">
</head>
<body>
    <div id="app">
        <div id="login-container">
            <div class="auth-box">
                <h2>🌈 家庭聊天</h2>
                <div class="version-badge">v2.0.0</div>
                <div id="login-form">
                    <input type="text" id="login-username" placeholder="👤 用户名">
                    <input type="password" id="login-password" placeholder="🔒 密码">
                    <button onclick="login()">登录</button>
                    <p class="switch-text">还没有账号？<a onclick="showRegister()">立即注册</a></p>
                </div>
                <div id="register-form" style="display: none;">
                    <input type="text" id="register-username" placeholder="👤 用户名">
                    <input type="password" id="register-password" placeholder="🔒 密码">
                    <input type="password" id="register-password-confirm" placeholder="🔒 确认密码">
                    <button onclick="register()">注册</button>
                    <p class="switch-text">已有账号？<a onclick="showLogin()">立即登录</a></p>
                </div>
                <p id="auth-message"></p>
            </div>
        </div>

        <div id="chat-container" style="display: none;">
            <div class="sidebar">
                <div class="user-info">
                    <div class="user-info-left">
                        <div class="user-avatar" id="user-avatar" onclick="openProfile()">
                            <span id="user-avatar-initial">?</span>
                        </div>
                        <div class="user-details">
                            <div class="user-name" id="current-user"></div>
                            <div class="user-status">
                                <span id="connection-status" style="font-size: 12px;"></span>
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button onclick="testNotification()" class="logout-btn" style="font-size: 14px;" title="测试通知">🔔</button>
                        <button onclick="logout()" class="logout-btn">🚪</button>
                    </div>
                </div>
                
                <div class="tabs">
                    <div class="tab active" data-tab="friends" onclick="switchTab('friends')">
                        📱 好友
                    </div>
                    <div class="tab" data-tab="contacts" onclick="switchTab('contacts')">
                        📖 通讯录
                    </div>
                    <div class="tab" data-tab="blacklist" onclick="switchTab('blacklist')">
                        ⛔ 黑名单
                    </div>
                </div>

                <div class="tab-content" id="friends-tab">
                    <div class="search-section">
                        <input type="text" id="search-input" placeholder="🔍 搜索用户...">
                        <button onclick="searchUsers()">搜索</button>
                    </div>
                    <div id="search-results"></div>
                    <div class="friends-header">
                        <h3>好友列表</h3>
                        <button onclick="refreshFriends()" class="refresh-btn">🔄</button>
                    </div>
                    <div id="friend-requests-section" style="display: none;">
                        <h4 onclick="toggleFriendRequests()" style="cursor: pointer;">📬 好友请求 ▼</h4>
                        <div id="friend-requests-list"></div>
                    </div>
                    <div id="friends-list"></div>
                </div>

                <div class="tab-content" id="contacts-tab" style="display: none;">
                    <div class="contacts-content">
                        <h3>✨ 我的通讯录</h3>
                        <div id="contacts-list"></div>
                    </div>
                </div>

                <div class="tab-content" id="blacklist-tab" style="display: none;">
                    <div class="blacklist-content">
                        <h3>⛔ 黑名单</h3>
                        <div id="blacklist-list"></div>
                    </div>
                </div>
            </div>
            
            <div class="chat-area">
                <div id="no-chat-selected">
                    <div class="no-chat-icon">💬</div>
                    <p>选择一个好友开始聊天</p>
                </div>
                <div id="chat-window" style="display: none;">
                    <div class="chat-header">
                        <button class="back-btn" onclick="closeChat()">‹</button>
                        <div class="chat-header-info">
                            <div class="friend-avatar" id="friend-avatar" onclick="openFriendProfile()">
                                <span id="friend-avatar-initial">?</span>
                            </div>
                            <div>
                                <h3 id="chat-with-username"></h3>
                            </div>
                        </div>
                        <div class="chat-header-actions">
                            <button class="action-btn" onclick="openFriendProfile()" title="好友资料">👤</button>
                            <button class="action-btn" onclick="startCall('audio')" title="语音通话">🎵</button>
                            <button class="action-btn" onclick="startCall('video')" title="视频通话">📹</button>
                        </div>
                    </div>
                    <div id="messages-container"></div>
                    <div class="message-input">
                        <button class="voice-input-btn" id="voice-input-btn" title="语音输入">🎤</button>
                        <input type="text" id="message-input" placeholder="💬 输入消息..." onkeypress="handleKeyPress(event)">
                        <button onclick="sendMessage()">发送 🚀</button>
                    </div>
                    <div id="voice-status"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="profile-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>👤 个人资料</h2>
                <button class="close-btn" onclick="closeProfile()">×</button>
            </div>
            <div class="modal-body">
                <div class="profile-avatar" onclick="document.getElementById('avatar-upload').click()">
                    <img id="profile-avatar-img" src="" style="display:none;width:80px;height:80px;border-radius:50%;object-fit:cover;">
                    <span id="profile-avatar-initial">?</span>
                    <div class="avatar-overlay">📷</div>
                </div>
                <input type="file" id="avatar-upload" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
                <div class="profile-field">
                    <label>用户名</label>
                    <input type="text" id="profile-username" placeholder="用户名">
                </div>
                <div class="profile-field">
                    <label>个性签名</label>
                    <textarea id="profile-bio" placeholder="这个人很懒，什么都没写~"></textarea>
                </div>
                <div class="profile-field">
                    <label>新密码（不修改请留空）</label>
                    <input type="password" id="profile-password" placeholder="新密码">
                </div>
                <button class="save-btn" onclick="saveProfile()">💾 保存修改</button>
            </div>
        </div>
    </div>

    <div id="friend-profile-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>👤 好友资料</h2>
                <button class="close-btn" onclick="closeFriendProfile()">×</button>
            </div>
            <div class="modal-body">
                <div class="profile-avatar">
                    <span id="friend-profile-avatar">?</span>
                </div>
                <div class="profile-field">
                    <label>用户名</label>
                    <input type="text" id="friend-profile-username" readonly>
                </div>
                <div class="profile-field">
                    <label>个性签名</label>
                    <textarea id="friend-profile-bio" readonly></textarea>
                </div>
                <div class="friend-actions" style="flex-wrap: wrap;">
                    <button class="call-action-btn" onclick="startCall('audio')">🎵 语音通话</button>
                    <button class="call-action-btn video-call-btn" onclick="startCall('video')">📹 视频通话</button>
                    <button class="delete-btn" onclick="deleteFriend()">❌ 删除好友</button>
                    <button class="block-btn" onclick="blockFriend()">⛔ 拉黑</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 通话界面 ===== -->
    <div id="call-overlay">
        <div id="incoming-call">
            <div class="call-avatar" id="caller-avatar">?</div>
            <div class="caller-name" id="caller-name">正在呼叫...</div>
            <div class="call-type-label" id="call-type-label">📹 视频通话</div>
            <div class="incoming-buttons">
                <button class="reject-call-btn" onclick="rejectCall()" title="拒绝">📞</button>
                <button class="accept-call-btn" onclick="acceptCall()" title="接听">📞</button>
            </div>
        </div>
        <div id="active-call">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <div class="call-timer" id="call-timer">00:00</div>
            <div class="call-controls">
                <button class="call-control-btn mute-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
                <button class="call-control-btn end-call-btn" onclick="endCall()">📞</button>
                <button class="call-control-btn speaker-btn" id="speaker-btn" onclick="toggleSpeaker()">🔊</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/chat.js"></script>
    <script>
        // ===== 清除旧的Service Worker =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var i = 0; i < registrations.length; i++) {
                    registrations[i].unregister();
                    console.log('旧Service Worker已注销');
                }
                // 清除所有缓存
                if ('caches' in window) {
                    caches.keys().then(function(names) {
                        for (var j = 0; j < names.length; j++) {
                            caches.delete(names[j]);
                            console.log('缓存已清除:', names[j]);
                        }
                    });
                }
                // 注册全新的SW（不拦截请求）
                navigator.serviceWorker.register('/static/sw.js', { scope: '/' })
                    .then(function(reg) {
                        console.log('新Service Worker注册成功');
                        reg.update();
                    })
                    .catch(function(err) {
                        console.log('Service Worker注册（可忽略）:', err);
                    });
            });
        }
        
        // 请求通知权限 - 更积极主动
        function requestNotificationPermission() {
            if ('Notification' in window) {
                if (Notification.permission === 'default') {
                    console.log('正在请求通知权限...');
                    Notification.requestPermission().then(permission => {
                        if (permission === 'granted') {
                            console.log('✅ 通知权限已授予');
                            // 立即显示一个测试通知
                            try {
                                new Notification('家庭聊天', {
                                    body: '通知功能已开启！有新消息时会收到提醒。',
                                    icon: '/static/icon.svg',
                                    vibrate: [100, 50, 100],
                                    tag: 'family-chat-welcome'
                                });
                            } catch (e) {
                                console.log('无法显示测试通知:', e);
                            }
                        } else if (permission === 'denied') {
                            console.log('❌ 通知权限被拒绝，请在设置中开启');
                        }
                    }).catch(err => {
                        console.log('权限请求出错:', err);
                    });
                } else if (Notification.permission === 'denied') {
                    console.log('通知权限已被拒绝，请在系统设置中重新开启');
                }
            } else {
                console.log('当前浏览器不支持通知');
            }
        }
        
        // 显示通知 - 增强版本（支持Android原生通知）
        function showNotification(title, body) {
            console.log('尝试显示通知:', title, body);
            
            // 优先使用Android原生通知（如果在WebView中）
            if (window.AndroidBridge && typeof window.AndroidBridge.showNotification === 'function') {
                console.log('📱 使用Android原生通知');
                window.AndroidBridge.showNotification(title, body);
                return;
            }
            
            // 降级使用浏览器通知
            if ('Notification' in window) {
                if (Notification.permission === 'granted') {
                    try {
                        const notification = new Notification(title, {
                            body: body,
                            icon: '/static/icon.svg',
                            badge: '/static/icon.svg',
                            vibrate: [200, 100, 200],
                            tag: 'family-chat',
                            renotify: true,
                            requireInteraction: false
                        });
                        
                        // 通知点击事件
                        notification.onclick = function() {
                            window.focus();
                            this.close();
                        };
                        
                        console.log('✅ 浏览器通知已显示');
                    } catch (e) {
                        console.log('❌ 显示浏览器通知失败:', e);
                    }
                } else if (Notification.permission === 'default') {
                    console.log('通知权限未设置，重新请求...');
                    requestNotificationPermission();
                } else {
                    console.log('❌ 通知权限被拒绝');
                }
            } else {
                console.log('❌ 当前环境不支持通知');
            }
        }
        
        // 多次尝试请求权限 - 在多个时机触发
        function setupPermissionRequests() {
            // 页面加载后1秒请求
            setTimeout(requestNotificationPermission, 1000);
            
            // 登录后再次请求
            window.addEventListener('userLoggedIn', function() {
                setTimeout(requestNotificationPermission, 500);
            });
            
            // 检测到是Android WebView时更积极请求
            const isAndroid = /Android/i.test(navigator.userAgent);
            if (isAndroid) {
                console.log('检测到Android环境');
                setTimeout(requestNotificationPermission, 500);
                setTimeout(requestNotificationPermission, 3000);
            }
        }
        
        // 页面加载时设置权限请求
        window.addEventListener('load', function() {
            console.log('页面加载完成，初始化通知系统');
            setupPermissionRequests();
        });
    </script>
</body>
</html>
