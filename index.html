<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>家聊</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#07C160">
<style>
  :root{
    --wx-green:#07C160; --wx-green-dark:#06A652;
    --wx-bg:#ededed; --wx-self:#95EC69; --wx-other:#ffffff;
    --wx-bar:#f7f7f7; --wx-bar-line:#d9d9d9;
    --wx-line:#e6e6e6; --wx-text:#191919; --wx-muted:#9a9a9a;
    --wx-red:#fa5151; --wx-blue:#576b95;
    --tab-h:54px; --header-h:48px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --wx-card:#ffffff; --wx-panel:#f2f2f2; --wx-input:#e3e3e3; --wx-active:#ececec;
    --msg-font:15px;
  }
  [data-theme="dark"]{
    --wx-bg:#0f0f0f; --wx-self:#2b6a4f; --wx-other:#2a2a2a;
    --wx-bar:#1b1b1b; --wx-bar-line:#2a2a2a; --wx-line:#2a2a2a;
    --wx-text:#e8e8e8; --wx-muted:#8a8a8a;
    --wx-card:#1f1f1f; --wx-panel:#1f1f1f; --wx-input:#2a2a2a; --wx-active:#2a2a2a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#c9c9c9;color:var(--wx-text);
    display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  /* 手机外壳：桌面居中，移动端全屏 */
  #phone{
    width:100%;max-width:430px;height:100dvh;max-height:100dvh;
    background:var(--wx-bg);display:flex;flex-direction:column;position:relative;overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.25);
  }
  .screen{flex:1;display:none;flex-direction:column;min-height:0;background:var(--wx-bg)}
  .screen.active{display:flex}
  /* 顶部栏 */
  .header{
    height:var(--header-h);flex:0 0 auto;display:flex;align-items:center;
    background:var(--wx-bar);border-bottom:1px solid var(--wx-bar-line);
    padding:0 8px;position:relative;z-index:5;
  }
  .header .title{font-size:17px;font-weight:600;flex:1;text-align:center}
  .header .left,.header .right{
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    color:#181818;cursor:pointer;flex:0 0 auto;
  }
  .header .right.action{font-size:15px;color:var(--wx-green);width:auto;padding:0 6px}
  .header .right.disabled{opacity:.4}
  /* 微信页搜索 */
  .searchbar{padding:8px 12px;background:var(--wx-bar);flex:0 0 auto}
  .searchbar input{
    width:100%;border:none;background:var(--wx-input);border-radius:8px;
    padding:8px 12px;font-size:14px;outline:none;text-align:center;color:var(--wx-text);
  }
  .searchbar input::placeholder{color:var(--wx-muted)}
  .list{flex:1;overflow:auto;background:var(--wx-card);-webkit-overflow-scrolling:touch}
  /* 会话项 */
  .item{display:flex;align-items:center;padding:11px 14px;position:relative;cursor:pointer;background:var(--wx-card)}
  .item:active{background:var(--wx-active)}
  .item+.item::before{content:"";position:absolute;top:0;left:68px;right:0;height:1px;background:var(--wx-line)}
  .avatar{
    width:46px;height:46px;border-radius:8px;flex:0 0 auto;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;
    margin-right:12px;overflow:hidden;
  }
  .item .mid{flex:1;min-width:0}
  .item .name{font-size:16px;color:var(--wx-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .preview{font-size:13px;color:var(--wx-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .item .rightcol{display:flex;flex-direction:column;align-items:flex-end;margin-left:8px;flex:0 0 auto}
  .item .time{font-size:11px;color:var(--wx-muted);margin-bottom:6px}
  .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--wx-red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
  /* 空态 */
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9a9a9a;text-align:center;padding:40px}
  .empty .big{font-size:46px;margin-bottom:14px;opacity:.5}
  .empty .btn{margin-top:18px;background:var(--wx-green);color:#fff;border:none;border-radius:6px;padding:9px 22px;font-size:15px;cursor:pointer}
  /* 底部 Tab */
  .tabbar{
    height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);
    flex:0 0 auto;display:flex;background:var(--wx-bar);border-top:1px solid var(--wx-bar-line);
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8a8a8a;font-size:11px;cursor:pointer;position:relative}
  .tab.active{color:var(--wx-green)}
  .tab svg{width:24px;height:24px}
  .tab .tab-badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--wx-red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
  /* 聊天页 */
  #chatScreen{background:var(--wx-bg);position:relative}
  .messages{flex:1;overflow:auto;padding:10px 10px 4px;-webkit-overflow-scrolling:touch}
  .divider{text-align:center;margin:12px 0;font-size:12px;color:#9a9a9a}
  .row{display:flex;margin:10px 4px;align-items:flex-start}
  .row.me{flex-direction:row-reverse}
  .row .av{width:38px;height:38px;border-radius:6px;flex:0 0 auto;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
  .row .bubble{
    max-width:68%;margin:0 10px;padding:9px 12px;font-size:var(--msg-font,15px);line-height:1.45;border-radius:6px;
    position:relative;word-break:break-word;white-space:pre-wrap;
  }
  .row.other .bubble{background:var(--wx-other)}
  .row.me .bubble{background:var(--wx-self)}
  .row .bubble::before{content:"";position:absolute;top:13px;width:0;height:0;border:6px solid transparent}
  .row.other .bubble::before{left:-11px;border-right-color:var(--wx-other)}
  .row.me .bubble::before{right:-11px;border-left-color:var(--wx-self)}
  .row .sender{font-size:11px;color:#9a9a9a;margin:0 10px 2px}
  .row.me .sender{text-align:right}
  /* 输入栏 */
  .composer{
    flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;padding:7px 10px;background:var(--wx-bar);
    border-top:1px solid var(--wx-bar-line);padding-bottom:calc(7px + var(--safe-b));
  }
  .composer .ic{width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#3a3a3a;cursor:pointer;font-size:22px}
  .composer textarea{
    flex:1;border:none;background:var(--wx-card);border-radius:6px;padding:8px 10px;font-size:15px;color:var(--wx-text);
    outline:none;resize:none;max-height:90px;min-height:34px;line-height:1.4;font-family:inherit;
  }
  .composer .send{
    flex:0 0 auto;background:var(--wx-green);color:#fff;border:none;border-radius:6px;
    padding:0 16px;height:34px;font-size:14px;cursor:pointer
  }
  .composer .send:disabled{opacity:.5}
  /* 表情面板 */
  .emoji-panel{display:none;flex-wrap:wrap;gap:4px;padding:10px;background:var(--wx-panel);border-top:1px solid var(--wx-bar-line);max-height:160px;overflow:auto}
  .emoji-panel.show{display:flex}
  .emoji-panel span{font-size:24px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px}
  .emoji-panel span:active{background:var(--wx-active)}
  /* 表情面板分页 + 我的表情 */
  .emoji-tabs{display:flex;gap:6px;width:100%;margin-bottom:6px}
  .emoji-tab{padding:3px 12px;border-radius:14px;font-size:13px;background:rgba(0,0,0,.06);color:#555;cursor:pointer}
  .emoji-tab.active{background:var(--wx-green);color:#fff}
  .emoji-grid{display:flex;flex-wrap:wrap;gap:4px;width:100%}
  .emoji-sticker{width:46px;height:46px;border-radius:8px;object-fit:cover;cursor:pointer;border:1px solid rgba(0,0,0,.06)}
  .emoji-sticker-add{width:46px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#888;cursor:pointer;border:1px dashed #bbb}
  /* 图片/表情消息气泡 */
  .bubble.img{padding:4px;line-height:0}
  .bubble.img::before{display:none}
  .bubble.img img{display:block;max-width:160px;max-height:180px;border-radius:8px}
  .bubble.img .img-expired{font-size:12px;color:#999;padding:8px;line-height:1.4}
  .bubble .sender-name{font-size:11px;color:#07C160;margin-bottom:3px;line-height:1.2}
  /* 语音消息气泡 */
  .bubble.voice{display:flex;align-items:center;gap:10px;min-width:120px;max-width:62%}
  .bubble.voice::before{display:none}
  .voice-play{width:30px;height:30px;border-radius:50%;background:var(--wx-green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;flex:0 0 auto}
  .row.me .voice-play{background:#fff;color:var(--wx-green)}
  .voice-dur{font-size:14px;color:#333}
  .row.me .voice-dur{color:#fff}
  .composer .ic.recording{color:#e64340;animation:vcpulse 1s infinite}
  @keyframes vcpulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
  /* 通讯录分组标题 */
  .group-title{padding:8px 14px;font-size:12px;color:#9a9a9a;background:var(--wx-bg)}
  /* 我 */
  .me-top{background:var(--wx-bar);padding:26px 18px;display:flex;align-items:center;gap:16px}
  .me-top .avatar{width:60px;height:60px;border-radius:10px;font-size:26px}
  .me-top .mn{font-size:20px;font-weight:600}
  .me-top .mid2{color:#9a9a9a;font-size:13px;margin-top:4px}
  .menu{background:var(--wx-card);margin-top:10px}
  .menu .mi{display:flex;align-items:center;padding:14px 16px;justify-content:space-between;cursor:pointer;font-size:15px;background:var(--wx-card)}
  .menu .mi:active{background:var(--wx-active)}
  .menu .mi+.mi{border-top:1px solid var(--wx-line)}
  .menu .mi .v{color:var(--wx-muted);font-size:14px}
  .menu .mi .chev{color:#c0c0c0;font-size:16px;margin-left:8px}
  /* 遮罩 + 弹窗 */
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;z-index:55;align-items:flex-end}
  .mask.show{display:flex}
  .sheet{width:100%;background:var(--wx-panel);border-radius:14px 14px 0 0;overflow:hidden;animation:up .2s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet .opt{padding:16px;text-align:center;background:#fff;font-size:17px;color:var(--wx-text);cursor:pointer}
  .sheet .opt:active{background:#ececec}
  .sheet .opt.danger{color:var(--wx-red)}
  .sheet .opt+.opt{border-top:1px solid var(--wx-line)}
  .sheet .cancel{margin-top:8px;background:#fff;padding:16px;text-align:center;font-size:17px;font-weight:600;cursor:pointer;color:var(--wx-text)}
  /* 居中对话框 */
  .dialog{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;z-index:55;align-items:center;justify-content:center;padding:30px}
  .dialog.show{display:flex}
  .card{width:100%;max-width:300px;background:var(--wx-card);border-radius:12px;overflow:hidden}
  .card .ct{padding:20px 18px 6px;font-size:16px;font-weight:600;text-align:center}
  .card .cb{padding:6px 18px 16px;color:#555;font-size:14px;text-align:center;line-height:1.6}
  .card input{width:calc(100% - 36px);margin:4px 18px 0;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:15px;outline:none}
  .card .cactions{display:flex;border-top:1px solid var(--wx-line);margin-top:16px}
  .card .cactions button{flex:1;padding:13px;border:none;background:#fff;font-size:16px;cursor:pointer;color:var(--wx-green)}
  .card .cactions button:active{background:#f0f0f0}
  .card .cactions button+button{border-left:1px solid var(--wx-line)}
  .card .cactions button.ghost{color:#555}
  .codebox{background:var(--wx-input);border-radius:8px;padding:10px;margin:10px 18px 4px;font-size:13px;word-break:break-all;color:var(--wx-text);user-select:all}
  .linkbox{font-size:12px;color:var(--wx-blue);word-break:break-all;padding:0 18px;margin-bottom:8px;user-select:all}
  /* 微信启动首屏 */
  #splash{position:absolute;inset:0;background:#ededed;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50}
  #splash .logo{width:80px;height:80px;border-radius:18px;background:var(--wx-green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:700;box-shadow:0 6px 20px rgba(7,193,96,.4)}
  #splash .tip{margin-top:18px;color:#9a9a9a;font-size:14px}
  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:60;display:none;max-width:80%;text-align:center}
  .toast.show{display:block}
  .statusbar{position:absolute;top:0;left:0;right:0;height:0;z-index:9}
  /* 发送状态 / @ / 打字 / 搜索 / 字体 */
  .row.me .st{align-self:center;margin:0 6px;font-size:12px;color:#9a9a9a;cursor:default;flex:0 0 auto}
  .row.me .st.fail{color:var(--wx-red);cursor:pointer}
  .at{color:#576b95;font-weight:600}
  .at.me{color:var(--wx-red)}
  .typing-bar{height:24px;display:none;align-items:center;justify-content:center;font-size:12px;color:var(--wx-muted);background:var(--wx-bg);flex:0 0 auto}
  .typing-bar.show{display:flex}
  .typing-bar .dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--wx-muted);margin:0 2px;animation:blink 1s infinite}
  .typing-bar .dot:nth-child(2){animation-delay:.2s}
  .typing-bar .dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .at-pop{position:absolute;left:8px;right:8px;bottom:56px;max-height:190px;overflow:auto;background:var(--wx-card);border:1px solid var(--wx-line);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none;z-index:15}
  .at-pop.show{display:block}
  .at-pop div{padding:11px 14px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--wx-line)}
  .at-pop div:last-child{border-bottom:none}
  .at-pop div:active{background:var(--wx-active)}
  .search-banner{display:none;align-items:center;justify-content:space-between;padding:7px 14px;background:#d9e6f7;color:#3a6ea5;font-size:13px;flex:0 0 auto}
  .search-banner.show{display:flex}
  .search-banner .clear{cursor:pointer;font-weight:600}
  /* 引用回复条 + 气泡内引用块 + 收藏 */
  .quote-bar{display:none;align-items:center;background:var(--wx-bar);border-top:1px solid var(--wx-bar-line);padding:8px 12px;flex:0 0 auto}
  .quote-bar.show{display:flex}
  .qb-text{flex:1;font-size:13px;color:var(--wx-muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .qb-close{margin-left:10px;color:#888;font-size:16px;cursor:pointer;padding:0 4px}
  .bubble .quote{background:rgba(0,0,0,.05);border-left:3px solid var(--wx-blue);border-radius:4px;padding:5px 8px;margin-bottom:6px;font-size:12px;color:var(--wx-muted);line-height:1.4}
  .bubble .quote .qn{color:var(--wx-blue);margin-bottom:2px}
  .bubble .quote .qt{white-space:pre-wrap;word-break:break-word}
  .fav-list{max-height:60vh;overflow:auto}
  .fav-item{padding:12px 16px;border-bottom:1px solid var(--wx-line);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .fav-item .fa{margin-top:6px;display:flex;gap:14px;font-size:13px;color:var(--wx-green)}
  .fav-item .fa span{cursor:pointer}
  .emoji-recent{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px;border-bottom:1px solid var(--wx-line);background:var(--wx-panel)}
  .emoji-recent span{font-size:20px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  /* 回到最新 悬浮按钮 */
  .jump-latest{position:absolute;right:14px;bottom:74px;width:42px;height:42px;border-radius:50%;background:var(--wx-card);box-shadow:0 2px 10px rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;font-size:20px;color:var(--wx-green);cursor:pointer;z-index:12;border:1px solid var(--wx-line)}
  .jump-latest.show{display:flex}
  .jl-badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--wx-red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid var(--wx-card)}
  /* 拍一拍 居中系统提示 */
  .row.sys{justify-content:center;margin:6px 4px}
  .sys-line{background:rgba(0,0,0,.06);color:var(--wx-muted);font-size:12px;padding:3px 10px;border-radius:6px;max-width:80%;text-align:center}
  [data-theme="dark"] .sys-line{background:rgba(255,255,255,.08);color:#aaa}
  /* 群信息面板（点群名打开） */
  #chatScreen[data-group="1"] #chatTitle{cursor:pointer}
  .gi{padding:8px 16px 8px;max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .gi-head{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0 14px}
  .gi-name{font-size:20px;font-weight:600;color:var(--wx-text);max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gi-edit{font-size:13px;color:var(--wx-blue);cursor:pointer;padding:2px 8px;border-radius:4px}
  .gi-edit:active{background:var(--wx-active)}
  .gi-sec{font-size:12px;color:var(--wx-muted);padding:10px 4px 6px}
  .gi-members{background:var(--wx-card);border-radius:10px;overflow:hidden;border:1px solid var(--wx-line)}
  [data-theme="dark"] .gi-members{background:rgba(30,36,54,.72);border-color:rgba(255,255,255,.14)}
  .gi-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--wx-line)}
  .gi-row:first-child{border-top:none}
  [data-theme="dark"] .gi-row{border-top-color:rgba(255,255,255,.12)}
  .gi-av{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:600;flex:0 0 auto}
  .gi-info{flex:1;min-width:0}
  .gi-mname{font-size:15px;color:var(--wx-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gi-muid{font-size:11px;color:var(--wx-muted);margin-top:2px;font-family:monospace}
  .gi-kick{font-size:13px;color:var(--wx-red);cursor:pointer;padding:4px 10px;border-radius:4px;flex:0 0 auto}
  .gi-kick:active{background:var(--wx-active)}
  .gi-act{display:flex;gap:10px;padding:14px 0 8px}
  .gi-act button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--wx-line);background:var(--wx-card);font-size:15px;color:var(--wx-text);cursor:pointer}
  [data-theme="dark"] .gi-act button{background:rgba(30,36,54,.72);border-color:rgba(255,255,255,.14)}
  .gi-act button:active{background:var(--wx-active)}
  .gi-leave{padding:12px;margin-top:6px;background:var(--wx-card);border-radius:8px;text-align:center;font-size:15px;color:var(--wx-red);cursor:pointer;border:1px solid var(--wx-line)}
  [data-theme="dark"] .gi-leave{background:rgba(30,36,54,.72);border-color:rgba(255,255,255,.14)}
  .gi-leave:active{background:var(--wx-active)}
  .gi-close{padding:12px;margin-top:8px;background:var(--wx-card);border-radius:8px;text-align:center;font-size:15px;color:var(--wx-text);cursor:pointer;border:1px solid var(--wx-line)}
  [data-theme="dark"] .gi-close{background:rgba(30,36,54,.72);border-color:rgba(255,255,255,.14)}
  .gi-close:active{background:var(--wx-active)}
  /* 聊天置顶消息横幅 */
  .pin-bar{display:none;align-items:center;background:#fffbe6;border-top:1px solid var(--wx-line);border-bottom:1px solid var(--wx-line);padding:6px 10px;font-size:13px;color:#8a6d3b;flex:0 0 auto}

  .row.me .st.read{color:var(--wx-muted)}

  .bubble.big-emoji{background:transparent!important;font-size:46px;line-height:1.25;padding:2px 2px;max-width:62%;box-shadow:none}

  /* 引用块可点击定位原消息 */
  .bubble .quote{cursor:pointer}
  /* 以下为新消息 分割线 */
  .divider.newdiv{color:var(--wx-red);font-weight:600}
  /* 聊天背景预设 */
  #chatScreen.bg-default, #messages.bg-default{background:var(--wx-bg)}
  #chatScreen.bg-green, #messages.bg-green{background:#e6f4ea}
  #chatScreen.bg-blue, #messages.bg-blue{background:#e7f0fb}
  #chatScreen.bg-paper, #messages.bg-paper{background:#f3ecd9}
  #chatScreen.bg-dark, #messages.bg-dark{background:#1a1a1a}
  /* 多选转发 */
  .row.selected .bubble{outline:2px solid var(--wx-green);outline-offset:1px}
  #chatScreen.selecting .composer, #chatScreen.selecting .emoji-panel, #chatScreen.selecting .quote-bar{display:none}
  .sel-bar{display:none;position:absolute;left:0;right:0;bottom:0;background:var(--wx-bar);border-top:1px solid var(--wx-bar-line);padding:10px 14px;align-items:center;justify-content:space-between;z-index:14;flex:0 0 auto;padding-bottom:calc(10px + var(--safe-b))}

  .sel-bar .sel-acts{display:flex;gap:18px;font-size:15px;color:var(--wx-green)}

  .merge-item{font-size:13px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin:3px 0}
  [data-theme="dark"] .merge-item{color:#ddd}
  .merge-item .mi-name{color:var(--wx-blue)}
  .merge-more{font-size:13px;color:#999}
  .merge-foot{font-size:12px;color:#999;margin-top:6px;padding-top:6px;border-top:1px solid rgba(0,0,0,.06)}
  /* 账号体系：登录/注册 */
  #authScreen{position:absolute;inset:0;z-index:80;background:linear-gradient(160deg,#07C160,#0a8f4f);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  #authScreen.show{display:flex}
  .auth-logo{color:#fff;font-size:42px;font-weight:800;letter-spacing:3px}
  .auth-sub{color:rgba(255,255,255,.88);font-size:13px;margin-top:6px;margin-bottom:28px}
  .auth-card{width:100%;max-width:320px;background:#fff;border-radius:16px;padding:22px 20px;box-shadow:0 14px 44px rgba(0,0,0,.28)}
  .auth-title{font-size:18px;font-weight:700;margin-bottom:16px;color:#181818}
  .auth-input{width:100%;box-sizing:border-box;height:44px;border:1px solid #e3e3e3;border-radius:9px;padding:0 12px;margin-bottom:12px;font-size:15px;outline:none;background:#fafafa}
  .auth-input:focus{border-color:#07C160;background:#fff}
  .auth-err{color:#fa5151;font-size:13px;min-height:18px;margin-bottom:4px}
  .auth-btn{width:100%;height:46px;border:none;border-radius:9px;background:#07C160;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}
  .auth-btn:active{opacity:.9}
  .auth-switch{text-align:center;color:#07C160;font-size:14px;margin-top:16px;cursor:pointer}
  .auth-forget{text-align:center;color:#999;font-size:12px;margin-top:10px;cursor:pointer}

  [data-theme="dark"] .auth-input{background:#2a2a2a;border-color:#3a3a3a;color:#eee}
/* ===== 液态玻璃主题（覆盖层，与介绍站一致） ===== */
:root{
  --emerald:#10b981; --teal:#0ea5a4; --cyan:#22d3ee; --violet:#a78bfa;
  --glass:rgba(255,255,255,.5); --glass-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.6);
  --glass-shadow:0 8px 32px rgba(15,23,42,.12), inset 0 1px 0 rgba(255,255,255,.7);
}
@keyframes lgfloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vw,3vw) scale(1.08)}66%{transform:translate(-3vw,2vw) scale(.96)}}
body{
  background:radial-gradient(120% 120% at 10% 0%,#d8f5ec 0%,#e6f3ff 45%,#f1e9ff 100%);
  overflow:hidden;
}
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;
  mix-blend-mode:multiply;z-index:-2;pointer-events:none;animation:lgfloat 22s ease-in-out infinite;
}
body::before{width:46vw;height:46vw;left:-8vw;top:-10vw;background:radial-gradient(circle,#5eead4,transparent 70%)}
body::after{width:40vw;height:40vw;right:-6vw;top:8vw;background:radial-gradient(circle,#a5b4fc,transparent 70%);animation-delay:-6s}

/* 手机外壳变为悬浮玻璃面板 */
#phone{
  background:rgba(255,255,255,.42);
  backdrop-filter:blur(30px) saturate(160%); -webkit-backdrop-filter:blur(30px) saturate(160%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 30px 70px rgba(15,23,42,.25), inset 0 1px 0 rgba(255,255,255,.7);
  overflow:hidden;
}
#phone::before,#phone::after{
  content:"";position:absolute;border-radius:50%;filter:blur(50px);opacity:.5;
  z-index:0;pointer-events:none;animation:lgfloat 26s ease-in-out infinite;
}
#phone::before{width:60%;height:60%;left:-15%;top:-10%;background:radial-gradient(circle,#7dd3fc,transparent 70%)}
#phone::after{width:55%;height:55%;right:-15%;bottom:-10%;background:radial-gradient(circle,#6ee7b7,transparent 70%);animation-delay:-10s}
.screen,.header,.tabbar,.list,.composer,.dialog,.mask,.toast,#splash,.messages{position:relative;z-index:1}
.screen{background:transparent}
.list{background:transparent}
#chatScreen{background:transparent}
.messages{background:transparent}

/* 顶/底栏玻璃 */
.header{
  background:var(--glass);
  backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.5);
}
.tabbar{
  background:var(--glass);
  backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-top:1px solid rgba(255,255,255,.5);
}
.searchbar{background:rgba(255,255,255,.4)}
.searchbar input{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.5)}

/* 会话项：悬浮玻璃卡片 */
.item{
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%);
  margin:8px 10px;border-radius:16px;box-shadow:0 2px 12px rgba(15,23,42,.07);
}
.item+.item::before{display:none}
.item:active{background:rgba(255,255,255,.65)}

/* 输入栏玻璃 */
.composer{
  background:var(--glass);
  backdrop-filter:blur(18px) saturate(160%); -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-top:1px solid rgba(255,255,255,.5);
}
.composer textarea{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.5)}

/* 气泡：液态玻璃 */
.row.other .bubble{
  background:rgba(255,255,255,.74);
  backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 2px 10px rgba(15,23,42,.08);
}
.row.other .bubble::before{display:none}
.row.me .bubble{
  background:linear-gradient(135deg,#34d399,#22d3ee);color:#063b2f;
  border:1px solid rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(16,185,129,.3);
}
.row.me .bubble::before{display:none}
.bubble.big-emoji{background:transparent!important;border:none!important;box-shadow:none}

/* 弹层 / 对话框 / 菜单 玻璃 */
.card{
  background:rgba(255,255,255,.74);
  backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.65);
  box-shadow:0 20px 50px rgba(15,23,42,.25), inset 0 1px 0 rgba(255,255,255,.7);
}
.card input{background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.1)}
.sheet{
  background:rgba(255,255,255,.74);
  backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 -10px 40px rgba(15,23,42,.2);
}
.sheet .opt{background:transparent}
.sheet .opt:active{background:rgba(255,255,255,.4)}
.sheet .cancel{background:rgba(255,255,255,.5)}
.menu{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(255,255,255,.5);border-radius:16px;overflow:hidden;margin:10px;
}
.menu .mi{background:transparent}
.menu .mi:active{background:rgba(255,255,255,.35)}
.me-top{
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
  border:1px solid rgba(255,255,255,.5);border-radius:16px;margin:10px;
}
.emoji-panel{background:rgba(255,255,255,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.5)}
.at-pop{background:rgba(255,255,255,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6)}
.pin-bar{background:rgba(255,245,224,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sel-bar{background:rgba(255,255,255,.7);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.5)}
.quote-bar{background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.jump-latest{background:rgba(255,255,255,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.6)}
.reed-bar{display:none;align-items:center;background:rgba(255,255,255,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 12px;flex:0 0 auto;font-size:13px;color:var(--teal);cursor:pointer}
.reed-bar.show{display:flex}
.reed-bar .reed-close{margin-left:auto;color:#999;padding:0 4px;cursor:pointer}
[data-theme="dark"] .reed-bar{background:rgba(30,36,54,.7);border:1px solid rgba(255,255,255,.14)}

/* 主色：翡翠/青 渐变 */
.composer .send{background:linear-gradient(135deg,var(--emerald),var(--teal))}
.composer .send:active{filter:brightness(.95)}
.header .right.action{color:var(--teal)}
.empty .btn{background:linear-gradient(135deg,var(--emerald),var(--teal))}
.tab.active{color:var(--teal)}
.fav-item .fa{color:var(--teal)}
.auth-btn{background:linear-gradient(135deg,var(--emerald),var(--teal))}
.auth-btn:active{filter:brightness(.95)}

/* 启动屏玻璃 */
#splash{background:rgba(255,255,255,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

/* 深色模式：深色玻璃 */
[data-theme="dark"] body{background:radial-gradient(120% 120% at 10% 0%,#0b1220 0%,#0d1b2a 45%,#1a1030 100%)}
[data-theme="dark"] #phone{background:rgba(20,25,40,.5);border-color:rgba(255,255,255,.12)}
[data-theme="dark"] .header,[data-theme="dark"] .tabbar,[data-theme="dark"] .composer,[data-theme="dark"] .searchbar{background:rgba(30,36,54,.5);border-color:rgba(255,255,255,.1)}
[data-theme="dark"] .item{background:rgba(40,46,66,.55)}
[data-theme="dark"] .item:active{background:rgba(50,56,78,.7)}
[data-theme="dark"] .row.other .bubble{background:rgba(50,56,78,.72);border-color:rgba(255,255,255,.12);color:#e8e8e8}
[data-theme="dark"] .row.me .bubble{background:linear-gradient(135deg,#0e7490,#155e75);color:#eafff7}
[data-theme="dark"] .card,[data-theme="dark"] .sheet,[data-theme="dark"] .menu,[data-theme="dark"] .me-top,[data-theme="dark"] .emoji-panel,[data-theme="dark"] .at-pop,[data-theme="dark"] .sel-bar,[data-theme="dark"] .quote-bar,[data-theme="dark"] .pin-bar{background:rgba(30,36,54,.72);border-color:rgba(255,255,255,.14)}
[data-theme="dark"] .composer textarea,[data-theme="dark"] .card input,[data-theme="dark"] .searchbar input{background:rgba(255,255,255,.08);color:#eee;border-color:rgba(255,255,255,.12)}
[data-theme="dark"] #splash{background:rgba(15,20,35,.5)}
</style>

<script>
/* push.js 已内联：避免外链 push.js 加载慢/失败导致主脚本不执行、卡在加载页 */
// push.js —— 浏览器端 Web Push（VAPID），无需自有服务器。
// 发送方用这些密钥直接把通知推给接收方的浏览器推送端点。
const VAPID_JWK = {
  kty: "EC", crv: "P-256",
  x: "pwOxVYQNGmZbSyoRJC8cXHJ3zSLN548X_-8aZUvwUQ4",
  y: "dCclQroxkImtddndFnx0iZQKQdBC4KyKqq6j7U47qIQ",
  d: "Q5RSHbRprP7pB0jAwbDGfbP7rqSAE1eCFW6mZSuhGLQ"
};
const VAPID_PUB_RAW = "BKcDsVWEDRpmW0sqESQvHFxyd80izeePF__vGmVL8FEOdCclQroxkImtddndFnx0iZQKQdBC4KyKqq6j7U47qIQ";

function b64urlToBytes(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  const pad = s.length % 4 ? "=".repeat(4 - (s.length % 4)) : "";
  const b = atob(s + pad);
  const a = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);
  return a;
}
function bytesToB64url(b) {
  let bin = "";
  for (let i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function hmac(keyBytes, data) {
  const k = await crypto.subtle.importKey("raw", keyBytes, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", k, data));
}
function concat(...arrs) {
  let n = 0; arrs.forEach(a => (n += a.length));
  const out = new Uint8Array(n);
  let o = 0;
  arrs.forEach(a => { out.set(a, o); o += a.length; });
  return out;
}
async function hkdf(salt, ikm, info, length) {
  // HKDF: extract = HMAC(salt, ikm); expand with info + counter
  const prk = await hmac(salt, ikm);
  let cur = new Uint8Array(0);
  const out = new Uint8Array(length);
  for (let i = 1; i <= Math.ceil(length / 32); i++) {
    cur = await hmac(prk, concat(cur, info, new Uint8Array([i])));
    out.set(cur, (i - 1) * 32);
  }
  return out;
}
async function ecdh(receiverPubRaw, privJwk) {
  const recvKey = await crypto.subtle.importKey(
    "jwk",
    { kty: "EC", crv: "P-256", x: bytesToB64url(receiverPubRaw.slice(1, 33)), y: bytesToB64url(receiverPubRaw.slice(33, 65)) },
    { name: "ECDH" }, false, []
  );
  const myPriv = await crypto.subtle.importKey("jwk", privJwk, { name: "ECDH" }, false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "ECDH", public: recvKey }, myPriv, 256);
  return new Uint8Array(bits);
}
function derToRaw(der) {
  let off = 2; // skip SEQUENCE + length (assume short form)
  off++; const rLen = der[off + 1]; const r = der.slice(off + 2, off + 2 + rLen);
  off = off + 2 + rLen; off++; const sLen = der[off + 1]; const s = der.slice(off + 2, off + 2 + sLen);
  const fix = v => { if (v.length < 32) { const t = new Uint8Array(32); t.set(v, 32 - v.length); return t; } return v; };
  return concat(fix(r), fix(s));
}
async function signJwt(payloadObj) {
  const enc = new TextEncoder();
  const h = bytesToB64url(enc.encode(JSON.stringify({ typ: "JWT", alg: "ES256" })));
  const p = bytesToB64url(enc.encode(JSON.stringify(payloadObj)));
  const data = h + "." + p;
  const key = await crypto.subtle.importKey("jwk", VAPID_JWK, { name: "ECDSA", namedCurve: "P-256" }, false, ["sign"]);
  const sigDer = new Uint8Array(await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, key, enc.encode(data)));
  return data + "." + bytesToB64url(derToRaw(sigDer));
}

async function encrypt(sub, payloadObj) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const subPub = b64urlToBytes(sub.keys.p256dh);
  const auth = b64urlToBytes(sub.keys.auth);
  const shared = await ecdh(subPub, VAPID_JWK);
  const ctx = concat(
    enc.encode("WebPush: content-encoding: aes128gcm"),
    new Uint8Array([0]), subPub, new Uint8Array([0]), b64urlToBytes(VAPID_PUB_RAW)
  );
  const ck = await hkdf(auth, shared, ctx, 32);
  const cek = ck.slice(0, 16), nonce = ck.slice(16, 32);
  const plain = concat(enc.encode(JSON.stringify(payloadObj)), new Uint8Array([0, 0]));
  const aesKey = await crypto.subtle.importKey("raw", cek, { name: "AES-GCM" }, false, ["encrypt"]);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: nonce }, aesKey, plain));
  return { body: concat(salt, ct), salt };
}

async function sendPush(sub, payloadObj) {
  const { body, salt } = await encrypt(sub, payloadObj);
  const aud = new URL(sub.endpoint).origin;
  const jwt = await signJwt({ aud, exp: Math.floor(Date.now() / 1000) + 86400, sub: "mailto:familychat@example.com" });
  await fetch(sub.endpoint, {
    method: "POST",
    headers: {
      "Content-Encoding": "aes128gcm",
      "Encryption": "salt=" + bytesToB64url(salt),
      "Crypto-Key": "dh=" + VAPID_PUB_RAW,
      "TTL": "2419200",
      "Authorization": "WebPush " + jwt
    },
    body
  });
}

async function subscribePush() {
  if (!("PushManager" in window)) return null;
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(VAPID_PUB_RAW) });
  return sub.toJSON();
}
window.FC_PUSH = { subscribePush, sendPush };

<script>
"use strict";
const BASE = "https://ntfy.sh";
const $ = (id)=>document.getElementById(id);
const PAL = ["#07C160","#10AEFF","#FF9C19","#FA5151","#6467EF","#13C2C2","#EB2EFF","#FF6B9D","#07C160","#5C6BC0"];

// ntfy 的 Title 头会进入 HTTP 头，浏览器强制 Latin-1（ISO-8859-1），中文等非 ASCII 会令 fetch 抛 TypeError。
// 因此发送方昵称统一 encodeURIComponent 成纯 ASCII 再塞进 Title；接收方再用 decTitle 还原。
function encTitle(s){ try{ return encodeURIComponent(s==null?"":String(s)); }catch(e){ return ""; } }
function decTitle(s){ if(!s) return ""; try{ const d=decodeURIComponent(s); return d; }catch(e){ return s; } }

function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

// ---------- 身份 ----------
let uid = localStorage.getItem("fc_uid");
if(!uid){ uid = "u"+Math.random().toString(36).slice(2,10); localStorage.setItem("fc_uid",uid); }
let myName = localStorage.getItem("fc_name") || "";

// ---------- 账号体系（无服务器，仅本机存储） ----------
let accounts = lsGet("fc_accounts", []);
let session = lsGet("fc_session", null);
let authMode = "register";

async function sha256(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function hashPw(pw, salt){ return await sha256(pw + "|" + salt); }
function genSalt(){ return Math.random().toString(36).slice(2,12); }

function showAuth(mode){
  authMode = mode || (accounts.length>0 ? "login" : "register");
  $("authScreen").classList.add("show");
  $("authTitle").textContent = authMode==="register" ? "注册账号" : "登录家聊";
  $("auName").style.display = authMode==="register" ? "" : "none";
  $("auPwd2").style.display = authMode==="register" ? "" : "none";
  $("authSubmit").textContent = authMode==="register" ? "注册" : "登录";
  $("authSwitch").textContent = authMode==="register" ? "已有账号？去登录" : "没有账号？去注册";
  $("authForget").style.display = authMode==="login" ? "" : "none";
  $("authErr").textContent = "";
  $("auUser").value=""; $("auName").value=""; $("auPwd").value=""; $("auPwd2").value="";
  setTimeout(()=>{ try{ $("auUser").focus(); }catch(e){} }, 60);
}
function hideAuth(){ $("authScreen").classList.remove("show"); }

async function doRegister(){
  const user = ($("auUser").value||"").trim();
  const name = ($("auName").value||"").trim() || user;
  const pwd = $("auPwd").value||"";
  const pwd2 = $("auPwd2").value||"";
  if(user.length<2){ $("authErr").textContent="账号至少 2 个字符"; return; }
  if(accounts.some(a=>a.user===user)){ $("authErr").textContent="该账号已存在，请直接登录"; return; }
  if(pwd.length<4){ $("authErr").textContent="密码至少 4 位"; return; }
  if(pwd!==pwd2){ $("authErr").textContent="两次密码不一致"; return; }
  const salt=genSalt(); const hash=await hashPw(pwd,salt);
  const acc={ user, name, uid:"u"+Math.random().toString(36).slice(2,10), salt, hash };
  accounts.push(acc); lsSet("fc_accounts", accounts);
  session={ user }; lsSet("fc_session", session);
  hideAuth(); applySession(acc);
}
async function doLogin(){
  const user=($("auUser").value||"").trim();
  const pwd=$("auPwd").value||"";
  const acc=accounts.find(a=>a.user===user);
  if(!acc){ $("authErr").textContent="账号不存在"; return; }
  if(acc.hash!==""){ // 设置过密码的账号需校验
    const hash=await hashPw(pwd, acc.salt);
    if(hash!==acc.hash){ $("authErr").textContent="密码错误"; return; }
  } // 空 hash（旧版迁移账号、未设密码）接受任意密码
  session={ user }; lsSet("fc_session", session);
  hideAuth(); applySession(acc);
}
function applySession(acc){
  uid = acc.uid || uid;
  myName = acc.name || myName;
  localStorage.setItem("fc_uid", uid);
  localStorage.setItem("fc_name", myName);
  renderMe();
  afterName();
}
async function setMyPassword(p){
  const acc=accounts.find(a=>a.user===(session&&session.user));
  if(!acc) return;
  const salt=genSalt(); acc.salt=salt; acc.hash=await hashPw(p,salt);
  lsSet("fc_accounts", accounts);
  toast("登录密码已设置");
}
function doLogout(){
  session=null; lsSet("fc_session", null);
  showAuth("login");
}
function initAuth(){
  accounts = lsGet("fc_accounts", []);
  session = lsGet("fc_session", null);
  // 旧版迁移：仅有昵称、无账号体系 → 自动建一个无密码账号并登录，避免锁死
  if(accounts.length===0 && myName){
    const legacy={ user:(myName||"me"), name:myName, uid:uid, salt:"", hash:"" };
    accounts.push(legacy); lsSet("fc_accounts", accounts);
    session={ user:legacy.user }; lsSet("fc_session", session);
  }
  const cur = session && accounts.find(a=>a.user===session.user);
  if(cur){ applySession(cur); return; }
  showAuth(accounts.length>0 ? "login" : "register");
}

// ---------- 会话数据（多会话） ----------
let chats = lsGet("fc_chats", null);
if(chats===null){
  const oldTopic = localStorage.getItem("fc_topic");
  chats = [];
  if(oldTopic){ chats.push(mkChat("家庭群聊", oldTopic)); }
  lsSet("fc_chats", chats);
}
function mkChat(name, topic){
  return { name, topic, color: colorFrom(topic), type:"single", members:[], unread:0, lastMsg:"", lastTime:0, order:Date.now(), pinned:false, mute:false };
}
function colorFrom(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return PAL[h%PAL.length]; }
function saveChats(){ lsSet("fc_chats", chats); }
function getChat(topic){ return chats.find(c=>c.topic===topic); }

// ---------- 消息存储 ----------
function msgKey(t){ return "fc_msgs_"+t; }
function getMsgs(t){ return lsGet(msgKey(t), []); }
function setMsgs(t,m){ lsSet(msgKey(t), m); }
function lastKey(t){ return "fc_last_"+t; }
function getLast(t){ return lsGet(lastKey(t), 1); }

// ---------- 工具 ----------
function escapeHtml(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
// 是否为「大表情」：纯 emoji 且 1~3 个（微信式贴纸放大显示）
function isBigEmoji(text){
  if(!text) return false;
  const t=text.trim();
  if(!t) return false;
  const cps=[...t];
  if(cps.length<1 || cps.length>3) return false;
  const ranges=[[0x2190,0x21FF],[0x2300,0x27BF],[0x2B00,0x2BFF],[0x2600,0x26FF],[0x2700,0x27BF],[0x1F000,0x1FAFF],[0xFE00,0xFE0F]];
  return cps.every(c=>{ const cp=c.codePointAt(0); if(cp===0x200D||cp===0x20E3) return true; return ranges.some(([a,b])=>cp>=a&&cp<=b); });
}
function fmtTime(ts){
  ts = ts*1000;
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString()===now.toDateString();
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  const pad = n=>String(n).padStart(2,"0");
  const hm = pad(d.getHours())+":"+pad(d.getMinutes());
  if(sameDay) return hm;
  if(d.toDateString()===yest.toDateString()) return "昨天 "+hm;
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+hm;
}
function sameDayTs(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function weekdayName(d){ const w=["周日","周一","周二","周三","周四","周五","周六"]; return w[d.getDay()]; }
function fmtDivider(ts){
  const d=new Date(ts*1000), now=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const hm=pad(d.getHours())+":"+pad(d.getMinutes());
  const y=new Date(now); y.setDate(now.getDate()-1);
  if(sameDayTs(d,now)) return "今天 "+hm;
  if(sameDayTs(d,y)) return "昨天 "+hm;
  const diff=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()-new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime())/86400000);
  if(diff<=7) return weekdayName(d)+" "+hm;
  if(d.getFullYear()===now.getFullYear()) return (d.getMonth()+1)+"月"+d.getDate()+"日 "+hm;
  return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 "+hm;
}
// 同天或间隔>5分钟才显示时间分割线（微信式）
function needDivider(prev,cur){
  if(!prev) return true;
  if(!sameDayTs(new Date(prev.time*1000), new Date(cur.time*1000))) return true;
  return (cur.time-prev.time) > 300;
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1400);
}
function avatarText(name){ return (name||"?").trim().charAt(0) || "?"; }

// ---------- 连接管理（统一 SSE：多 topic 合并为单连接，规避 ntfy 限流 429） ----------
let esConn = null;            // 当前统一 EventSource
let esBackoff = 1000;         // 重连退避（毫秒，指数增长，封顶 30s）
let esReconnectTimer = null;
let esAlive = false;

function closeUnified(){
  if(esReconnectTimer){ clearTimeout(esReconnectTimer); esReconnectTimer=null; }
  if(esConn){ try{ esConn.onopen=null; esConn.onmessage=null; esConn.onerror=null; esConn.close(); }catch(e){} esConn=null; }
  esAlive=false;
}
// 把所有会话 topic 拼成 ntfy 多 topic SSE（/t1/t2/t3/sse，ntfy 原生支持，单连接覆盖多房间）
function buildSseUrl(){
  const topics = chats.map(c=>c.topic).filter(Boolean);
  if(!topics.length) return null;
  return BASE + "/" + topics.join("/") + "/sse";
}
function ensureConnection(){
  const url = buildSseUrl();
  if(!url) return;
  if(esConn && esConn._url===url) return; // topic 集合未变，无需重建
  closeUnified();
  try{
    const es = new EventSource(url);
    es._url = url;
    es.onopen = ()=>{ esBackoff=1000; esAlive=true; };
    es.onmessage = (e)=>{
      try{
        const m = JSON.parse(e.data);
        esBackoff=1000; esAlive=true;
        const t = (m && m.topic) || (chats[0] && chats[0].topic);
        if(t) handleIncoming(t, m);
      }catch(_){}
    };
    es.onerror = ()=>{
      // 浏览器会自动重连；再叠一层指数退避，避免 429 时被瞬间疯狂重连拖垮
      try{ es.close(); }catch(e){}
      esConn=null; esAlive=false;
      scheduleReconnect();
    };
    esConn = es;
  }catch(e){ scheduleReconnect(); }
}
function scheduleReconnect(){
  if(esReconnectTimer) return;
  esReconnectTimer = setTimeout(()=>{
    esReconnectTimer=null;
    if(!esAlive) ensureConnection();
  }, esBackoff);
  esBackoff = Math.min(esBackoff*2, 30000);
}
// 新增/加入会话：确保统一连接覆盖该 topic，并立即注册 Web Push 订阅
const subShareTs = {}; // 每个 topic 上次广播 push 订阅的时间，用于节流（避免每 60s 全量发布触发 ntfy 429）
function connectTopic(topic){
  ensureConnection();
  subShareTs[topic] = 0; // 新会话强制立即共享，后续走节流
  try{ shareSubscription(topic); }catch(e){}
}
// 全量连接：错峰拉取各会话历史 + 建立统一 SSE
function connectAll(){
  const topics = chats.map(c=>c.topic).filter(Boolean);
  topics.forEach((t,i)=> setTimeout(()=>{ if(document.visibilityState!=="hidden") loadHistory(t); }, i*400));
  ensureConnection();
}
function loadHistory(topic){
  const since = getLast(topic);
  fetch(BASE+"/"+topic+"/json?since="+since).then(r=>r.json()).then(arr=>{
    (arr||[]).forEach(m=>handleIncoming(topic, m, true));
    const mx = (arr||[]).reduce((a,m)=>Math.max(a, m.time||0), since);
    if(mx>since) lsSet(lastKey(topic), mx);
  }).catch(()=>{});
}
async function shareSubscription(topic){
  if(!window.FC_PUSH) return;
  const now = Date.now();
  if(subShareTs[topic] && now - subShareTs[topic] < 600000) return; // 10 分钟内已广播过则跳过，显著减少 ntfy 发布量
  try{
    const sub = await FC_PUSH.subscribePush();
    if(sub){ await fetch(BASE+"/"+topic, {method:"POST", headers:{"Title":"sub","Tags":"sub"+uid,"Priority":"min"}, body: JSON.stringify(sub)}); subShareTs[topic]=Date.now(); }
  }catch(e){}
}
function handleIncoming(topic, m, fromHistory){
  if(!m || m.event!=="message") return;
  const tags = m.tags||[];
  // 收集他人 Web Push 订阅端点
  if(tags.includes("sub")){
    try{ const s=JSON.parse(m.message); if(s&&s.endpoint){ const arr=lsGet("fc_subs_"+topic,[]); arr.push(s); lsSet("fc_subs_"+topic, dedupeSubs(arr)); } }catch(e){}
    return;
  }
  const sender = (tags&&tags[0])||"";
  // 拍一拍 控制消息：仅对方发来的渲染（自己的回声在此前已本地渲染）
  const patTagIdx = (tags||[]).findIndex(t=>typeof t==="string" && t.indexOf("pat_")===0);
  if(patTagIdx>=0){ if(sender!==uid){ try{ const p=JSON.parse(m.message||"{}"); addPatLine(topic, p.from, p.to); }catch(e){} } return; }
  // 已读回执：对方读到你发的消息
  const readTagIdx = (tags||[]).findIndex(t=>typeof t==="string" && t.indexOf("read_")===0);
  if(readTagIdx>=0){ if(sender!==uid){ try{ const ts=parseFloat(m.message||"0"); if(ts>0) markRead(topic, ts); }catch(e){} } return; }
  // 置顶消息同步
  const pinTagIdx = (tags||[]).findIndex(t=>typeof t==="string" && t.indexOf("pin_")===0);
  if(pinTagIdx>=0){
    if(sender!==uid){
      const c=getChat(topic);
      if(c){ if(m.message){ try{ c.pinned=JSON.parse(m.message); }catch(e){ c.pinned=null; } } else c.pinned=null; saveChats(); if(topic===activeTopic) renderPin(); }
    }
    return;
  }
  // 群成员控制：改名 / 移除 / 退出（Sender 是操作者，自己发出则被下面 sender===uid 跳过，避免重复应用）
  const renameTag = tags.find(t=>typeof t==="string" && t.indexOf("rename_")===0);
  if(renameTag){ if(sender!==uid){ applyGroupRename(topic, decTitle(m.message)||"", false); } return; }
  const kickTag = tags.find(t=>typeof t==="string" && t.indexOf("kick_")===0);
  if(kickTag){ if(sender!==uid){ applyGroupKick(topic, m.message||"", false); } return; }
  const leaveTag = tags.find(t=>typeof t==="string" && t.indexOf("leave_")===0);
  if(leaveTag){ if(sender!==uid){ applyGroupLeave(topic, m.message||"", false); } return; }
  if(sender===uid) return; // 跳过自己（含撤回/打字回声）
  // 撤回控制消息：tags 含 recall_<id>
  const recallTag = tags.find(t=>typeof t==="string" && t.indexOf("recall_")===0);
  if(recallTag){ recallMessage(topic, recallTag.slice("recall_".length)); return; }
  // 打字指示器（仅实时消息，历史回放忽略）
  if(tags.includes("typing") && !fromHistory){ showTyping(topic, decTitle(m.title)||"对方"); return; }
  // 图片/表情/语音（ntfy 附件）
  if(m.attachment && m.attachment.url){
    const at=m.attachment; const nm=(at.name||"");
    if(nm.indexOf("voice-")===0){
      const dm=nm.match(/^voice-(\d+)\./); const dur=dm?parseInt(dm[1],10):0;
      addLocalMsg(topic, {id:m.id, sender, name:decTitle(m.title)||"对方", text:"", voice:at.url, dur, time:(m.time||Date.now()/1000), self:false, type:"voice"}, {silentUnread:false});
      tryUpgradeAttachment(topic, m.id, at.url, "voice");
    } else {
      addLocalMsg(topic, {id:m.id, sender, name:decTitle(m.title)||"对方", text:"", img:at.url, w:0, h:0, time:(m.time||Date.now()/1000), self:false, type:"image"}, {silentUnread:false});
      tryUpgradeAttachment(topic, m.id, at.url, "image");
    }
    if(!fromHistory) playNewMsgCue(topic);
    return;
  }
  const parsed = parseQuote(m.message||"");
  const pm = parseMerge(parsed.text);
  if(pm.ok){ addLocalMsg(topic, {id:m.id, sender, name:decTitle(m.title)||"对方", text:"", merge:pm.items, time:(m.time||Date.now()/1000), self:false, mentioned:false}, {silentUnread:false}); if(!fromHistory) playNewMsgCue(topic); return; }
  const mentioned = !!myName && myName.length>0 && parsed.text.indexOf("@"+myName) >= 0;
  addLocalMsg(topic, {id:m.id, sender, name:decTitle(m.title)||"对方", text:parsed.text, quote:parsed.quote, time:(m.time||Date.now()/1000), self:false, mentioned}, {silentUnread:false});
  if(!fromHistory) playNewMsgCue(topic);
}

// 撤回：用灰色系统提示「X 撤回了一条消息」替换原消息（微信式），而非直接删除
function recallMessage(topic, msgId){
  const msgs = getMsgs(topic);
  const chat=getChat(topic);
  const idx = msgs.findIndex(x=>x.id===msgId);
  if(idx<0){
    // 本地无此消息（如离线时发来又撤回）：末尾补一条系统提示
    if(chat){ const line={id:"rec-"+msgId, sender:"", name:"", text:"对方撤回了一条消息", type:"sysrec", time:Date.now()/1000, self:false}; msgs.push(line); setMsgs(topic, msgs); if(topic===activeTopic){ appendBubble(line); scrollBottom(); } renderChats(); }
    return;
  }
  const m = msgs[idx];
  const who = m.self ? "你" : (m.name||"对方");
  const line = {id:m.id, sender:"", name:"", text: who+" 撤回了一条消息", type:"sysrec", time:m.time, self:false};
  msgs[idx] = line;
  setMsgs(topic, msgs);
  if(chat){
    const last = msgs[msgs.length-1];
    chat.lastMsg = last ? (last.type==="sysrec" ? last.text : ((last.self?"":last.name+": ")+last.text)) : "";
    chat.lastTime = last ? last.time : 0;
    saveChats();
  }
  if(topic===activeTopic) renderChatFull(topic);
  renderChats();
}

let typingHideTimer=null;
function showTyping(topic, name){
  if(topic!==activeTopic) return;
  const bar=$("typingBar"); if($("typingName")) $("typingName").textContent=name||"对方";
  bar.classList.add("show");
  clearTimeout(typingHideTimer);
  typingHideTimer=setTimeout(()=>bar.classList.remove("show"), 4000);
}

function dedupeSubs(arr){
  const seen={}; const out=[];
  arr.forEach(s=>{ if(s&&s.endpoint&&!seen[s.endpoint]){ seen[s.endpoint]=1; out.push(s);} });
  return out;
}

// ---------- 消息写入 ----------
function addLocalMsg(topic, msg, opts){
  opts=opts||{};
  const msgs=getMsgs(topic);
  if(msgs.some(x=>x.id===msg.id)) return;
  msgs.push(msg);
  if(msgs.length>500) msgs.splice(0, msgs.length-500);
  setMsgs(topic, msgs);

  const chat=getChat(topic);
  if(chat){
    if(!chat.members) chat.members=[];
    const _su = msg.self ? uid : (msg.sender||"");
    const _sn = msg.self ? (myName||"我") : (msg.name||"家人");
    if(_su && !chat.members.some(x=>x.uid===_su)) chat.members.push({uid:_su, name:_sn});
    chat.lastMsg = (msg.type==="pat") ? msg.text : (msg.type==="voice") ? ((msg.self?"":msg.name+": ")+"[语音]") : (msg.type==="image") ? ((msg.self?"":msg.name+": ")+"[图片]") : (msg.merge ? ((msg.self?"":msg.name+": ")+"[聊天记录]") : ((msg.self?"":msg.name+": ")+msg.text));
    chat.lastTime = msg.time;
    const visibleNow = (topic===activeTopic && !document.hidden);
    if(!opts.silentUnread && !visibleNow) chat.unread=(chat.unread||0)+1;
    if(!msg.self && msg.mentioned && !visibleNow) chat.atMe=true;
    chat.order=Date.now();
    saveChats();
  }
  if(topic===activeTopic){
    appendBubble(msg);
    if(atBottom){ scrollBottom(); if(!msg.self && !document.hidden) maybeSendRead(topic); }
    else if(!msg.self){ newCount++; updateJumpBadge(); }
  }
  renderChats();
  updateTabBadge();
  // 后台通知：APK 内由原生层统一弹系统通知，避免重复；浏览器 PWA 用 Web Notification；免打扰不通知
  if(topic!==activeTopic && document.hidden && typeof AndroidBridge==="undefined" && !(chat && chat.mute)){
    notify(myName||"家聊", (msg.name||"")+": "+(msg.text||""));
  }
}

async function sendMessage(topic, text, quote){
  text=(text||"").trim(); if(!text) return;
  const name = myName || "我";
  const id = "local-"+Date.now()+"-"+Math.random().toString(36).slice(2,6);
  const body = embedQuote(text, quote);
  addLocalMsg(topic, {id, sender:uid, name, text, quote:quote||null, time:Date.now()/1000, self:true, status:"sending"}, {silentUnread:true});
  try{
    await fetch(BASE+"/"+topic, {method:"POST", headers:{ "Title":encTitle(name), "Tags":uid, "Priority":"3" }, body:body});
    updateMsgStatus(topic, id, "delivered");
    // 给在线订阅者推 Web Push（页面关闭也能收）
    const subs = lsGet("fc_subs_"+topic, []);
    for(const s of subs){ if(window.FC_PUSH) FC_PUSH.sendPush(s, {title:name, body:text}).catch(()=>{}); }
  }catch(e){ updateMsgStatus(topic, id, "failed"); toast("发送失败，点击重发"); }
}

function updateMsgStatus(topic, id, status){
  const msgs=getMsgs(topic); const m=msgs.find(x=>x.id===id);
  if(!m) return; m.status=status; setMsgs(topic, msgs);
  if(topic===activeTopic) renderChatFull(topic);
}
function dataURLToBytes(d){
  try{ const i=d.indexOf(","); const b64=d.slice(i+1); const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let j=0;j<bin.length;j++) arr[j]=bin.charCodeAt(j); return arr.buffer; }catch(e){ return null; }
}
async function sendImageMsg(topic, dataURL, w, h){
  if(!dataURL) return;
  const name=myName||"我";
  const id="local-"+Date.now()+"-"+Math.random().toString(36).slice(2,6);
  addLocalMsg(topic, {id, sender:uid, name, img:dataURL, w:w||0, h:h||0, time:Date.now()/1000, self:true, type:"image", status:"sending"}, {silentUnread:true});
  try{
    const bin=dataURLToBytes(dataURL); if(!bin) throw new Error("encode");
    await fetch(BASE+"/"+topic, {method:"POST", headers:{ "Title":encTitle(name), "Tags":uid, "Priority":"3", "Content-Type":"image/jpeg", "X-Filename":"sticker.jpg" }, body:bin});
    updateMsgStatus(topic, id, "delivered");
    const subs=lsGet("fc_subs_"+topic, []); for(const s of subs){ if(window.FC_PUSH) FC_PUSH.sendPush(s, {title:name, body:"[图片]"}).catch(()=>{}); }
  }catch(e){ updateMsgStatus(topic, id, "failed"); toast("发送失败，点击重发"); }
}
function dataURLToBlob(d){
  try{ const i=d.indexOf(","); const meta=d.slice(0,i); const mime=(meta.match(/:(.*?);/)||[])[1]||"audio/webm"; const bin=atob(d.slice(i+1)); const arr=new Uint8Array(bin.length); for(let j=0;j<bin.length;j++) arr[j]=bin.charCodeAt(j); return new Blob([arr],{type:mime}); }catch(e){ return null; }
}
let _rec=null;
function startVoice(){
  if(!activeTopic){ toast("请先进入一个聊天"); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast("当前环境不支持录音"); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    _rec={stream, chunks:[], start:Date.now(), mr:new MediaRecorder(stream)};
    _rec.mr.ondataavailable=e=>{ if(e.data && e.data.size) _rec.chunks.push(e.data); };
    _rec.mr.onstop=onVoiceStop;
    _rec.mr.start();
    const mb=$("micBtn"); if(mb){ mb.classList.add("recording"); mb.textContent="■"; }
    toast("录音中… 再次点击麦克风发送");
  }).catch(e=>{ toast("无法录音："+(e&&e.name||e)); });
}
function stopVoice(){ if(_rec && _rec.mr && _rec.mr.state!=="inactive"){ try{ _rec.mr.stop(); }catch(e){} } }
function onVoiceStop(){
  const r=_rec; _rec=null;
  const mb=$("micBtn"); if(mb){ mb.classList.remove("recording"); mb.textContent="🎤"; }
  if(!r) return;
  try{ r.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  const dur=Math.max(1, Math.round((Date.now()-r.start)/1000));
  if(dur<1){ toast("录音太短"); return; }
  const blob=new Blob(r.chunks,{type:(r.mr.mimeType||"audio/webm")});
  const rd=new FileReader();
  rd.onload=()=>{ sendVoiceMsg(activeTopic, rd.result, blob.type, dur); };
  rd.onerror=()=>toast("处理失败");
  rd.readAsDataURL(blob);
}
async function sendVoiceMsg(topic, dataURL, mime, dur){
  if(!dataURL) return;
  const name=myName||"我";
  const id="local-"+Date.now()+"-"+Math.random().toString(36).slice(2,6);
  addLocalMsg(topic, {id, sender:uid, name, voice:dataURL, dur, time:Date.now()/1000, self:true, type:"voice", status:"sending"}, {silentUnread:true});
  try{
    const blob=dataURLToBlob(dataURL); if(!blob) throw new Error("enc");
    await fetch(BASE+"/"+topic, {method:"POST", headers:{ "Title":encTitle(name), "Tags":uid, "Priority":"3", "Content-Type":mime||"audio/webm", "X-Filename":"voice-"+dur+".webm" }, body:blob});
    updateMsgStatus(topic, id, "delivered");
    const subs=lsGet("fc_subs_"+topic, []); for(const s of subs){ if(window.FC_PUSH) FC_PUSH.sendPush(s, {title:name, body:"[语音]"}).catch(()=>{}); }
  }catch(e){ updateMsgStatus(topic, id, "failed"); toast("发送失败，点击重发"); }
}
function voiceBubble(m){
  const row=document.createElement("div"); row.className="row "+(m.self?"me":"other"); row.dataset.id=m.id;
  if(selectMode && selected.has(m.id)) row.classList.add("selected");
  const c=activeTopic?getChat(activeTopic):null;
  const av=document.createElement("div"); av.className="av";
  av.style.background = m.self? "#07C160" : (c?c.color:colorFrom(m.sender||m.name));
  av.textContent = avatarText(m.self?(myName||"我"):(m.name||"对方"));
  const b=document.createElement("div"); b.className="bubble voice";
  appendSenderName(b, m);
  const play=document.createElement("div"); play.className="voice-play"; play.textContent="▶";
  const dur=document.createElement("div"); dur.className="voice-dur"; dur.textContent=(m.dur||0)+"″";
  b.appendChild(play); b.appendChild(dur);
  play.onclick=()=>{ try{ const a=new Audio(m.voice); a.play(); play.textContent="⏸"; a.onended=()=>{ play.textContent="▶"; }; }catch(e){ toast("无法播放"); } };
  row.appendChild(av); row.appendChild(b);
  if(m.self){
    const st=document.createElement("div"); st.className="st"+(m.status==="failed"?" fail":"")+(m.read?" read":"");
    let label=""; if(m.status==="sending") label="⏳"; else if(m.status==="failed") label="⚠ 重发"; else if(m.read) label="已读"; else if(m.status==="delivered") label="已送达";
    st.textContent=label; if(m.status==="failed") st.onclick=()=>retrySend(activeTopic, m.id); row.appendChild(st);
  }
  attachLongPress(row, ()=>showMsgMenu(m));
  return row;
}
$("micBtn").onclick=()=>{ if(_rec) stopVoice(); else startVoice(); };
function retrySend(topic, id){
  const msgs=getMsgs(topic); const m=msgs.find(x=>x.id===id); if(!m) return;
  updateMsgStatus(topic, id, "sending");
  if(m.type==="image" && m.img && m.img.indexOf("data:")===0){
    const bin=dataURLToBytes(m.img);
    if(bin){ fetch(BASE+"/"+topic, {method:"POST", headers:{ "Title":encTitle(myName||"我"), "Tags":uid, "Priority":"3", "Content-Type":"image/jpeg", "X-Filename":"sticker.jpg" }, body:bin})
      .then(()=>updateMsgStatus(topic, id, "delivered")).catch(()=>updateMsgStatus(topic, id, "failed")); return; }
  }
  if(m.type==="voice" && m.voice && m.voice.indexOf("data:")===0){
    const blob=dataURLToBlob(m.voice);
    if(blob){ fetch(BASE+"/"+topic, {method:"POST", headers:{ "Title":encTitle(myName||"我"), "Tags":uid, "Priority":"3", "Content-Type":(blob.type||"audio/webm"), "X-Filename":"voice-"+(m.dur||0)+".webm" }, body:blob})
      .then(()=>updateMsgStatus(topic, id, "delivered")).catch(()=>updateMsgStatus(topic, id, "failed")); return; }
  }
  fetch(BASE+"/"+topic, {method:"POST", headers:{ "Title":encTitle(myName||"我"), "Tags":uid, "Priority":"3" }, body:m.text})
    .then(()=>updateMsgStatus(topic, id, "delivered"))
    .catch(()=>updateMsgStatus(topic, id, "failed"));
}

let searchKw = "";
function renderChats(){
  const box=$("chatList"); box.innerHTML="";
  if(searchKw.trim()){ renderSearchResults(searchKw.trim(), box); return; }
  let list = chats.slice().filter(c=>!c.hidden).sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || b.order-a.order);
  if(searchKw){ const k=searchKw.toLowerCase(); list=list.filter(c=>c.name.toLowerCase().includes(k)); }
  if(list.length===0){
    const e=document.createElement("div"); e.className="empty";
    e.innerHTML = '<div class="big">💬</div><div>还没有聊天</div>';
    const b=document.createElement("button"); b.className="btn"; b.textContent="发起聊天";
    b.onclick=openAddDialog; e.appendChild(b); box.appendChild(e); return;
  }
  list.forEach(c=>{
    const it=document.createElement("div"); it.className="item";
    const av=document.createElement("div"); av.className="avatar"; av.style.background=c.color; av.textContent=avatarText(c.name);
    const mid=document.createElement("div"); mid.className="mid";
    const nm=document.createElement("div"); nm.className="name"; nm.textContent=c.name + (c.atMe?" ［有人@我］":"") + (c.mute?" 🔕":"") + (c.pinned?" 📌":"");
    const pv=document.createElement("div"); pv.className="preview"; pv.textContent=c.lastMsg||"";
    mid.appendChild(nm); mid.appendChild(pv);
    const rc=document.createElement("div"); rc.className="rightcol";
    if(c.lastTime){ const tm=document.createElement("div"); tm.className="time"; tm.textContent=fmtTime(c.lastTime); rc.appendChild(tm); }
    if(c.unread>0){ const bd=document.createElement("div"); bd.className="badge"; bd.textContent=c.unread>99?"99+":c.unread; rc.appendChild(bd); }
    it.appendChild(av); it.appendChild(mid); it.appendChild(rc);
    it.onclick=()=>openChat(c.topic);
    attachLongPress(it, ()=>showChatMenu(c));
    box.appendChild(it);
  });
}
// 全局搜索：匹配会话名 + 所有会话的消息内容
function renderSearchResults(kw, box){
  const k=kw.toLowerCase();
  const results=[];
  chats.forEach(c=>{
    if(c.name.toLowerCase().includes(k)) results.push({topic:c.topic, name:c.name, color:c.color, snippet:"打开会话", isChat:true});
    getMsgs(c.topic).forEach(m=>{
      const t=(m.text||"").toLowerCase();
      if(t && t.indexOf(k)>=0) results.push({topic:c.topic, name:c.name, color:c.color, snippet:(m.self?"我":(m.name||"对方"))+": "+(m.text||""), isChat:false});
    });
  });
  if(results.length===0){
    box.innerHTML='<div class="empty"><div class="big">🔍</div><div>没有找到相关聊天或消息</div></div>'; return;
  }
  results.slice(0,100).forEach(r=>{
    const it=document.createElement("div"); it.className="item";
    const av=document.createElement("div"); av.className="avatar"; av.style.background=r.color; av.textContent=avatarText(r.name);
    const mid=document.createElement("div"); mid.className="mid";
    const nm=document.createElement("div"); nm.className="name"; nm.textContent=(r.isChat?"💬 ":"")+r.name;
    const pv=document.createElement("div"); pv.className="preview"; pv.textContent=(r.isChat?"":r.snippet);
    mid.appendChild(nm); mid.appendChild(pv);
    it.appendChild(av); it.appendChild(mid);
    it.onclick=()=>{ searchKw=""; const si=$("searchInput"); if(si) si.value=""; openChat(r.topic); };
    box.appendChild(it);
  });
}

// ---------- 渲染：聊天详情 ----------
let activeTopic = null;
function openChat(topic){
  const c=getChat(topic); if(!c) return;
  if(c.hidden){ c.hidden=false; saveChats(); }
  activeTopic=topic;
  const hadUnread = c.unread>0;
  c.unread=0; c.atMe=false; saveChats(); renderChats(); updateTabBadge();
  replyingTo=null; hideQuoteBar();
  newCount=0; updateJumpBadge(); const jb2=$("jumpLatest"); if(jb2) jb2.classList.remove("show"); atBottom=true;
  searchInChat=""; renderSearchBanner();
  $("chatTitle").textContent = (c.type==="group") ? (c.name+"（"+(c.members?c.members.length:1)+"）") : c.name;
  $("chatScreen").dataset.group = (c.type==="group")?"1":"0";
  renderPin();
  newMsgFrom = c.lastSeen||0;
  showNewDivider = hadUnread && newMsgFrom>0;
  renderChatFull(topic);
  const _lm=getMsgs(topic); const _lastm=_lm[_lm.length-1]; c.lastSeen = _lastm?_lastm.time:Date.now()/1000; saveChats();
  showScreen("chatScreen");
  $("text").disabled=false; $("sendBtn").disabled=false;
  if(hadUnread) sendRead(topic);
  setTimeout(()=>{ try{$("text").focus();}catch(e){} }, 200);
  // 同步给原生层（用于后台推送/通知归并）
  if(typeof AndroidBridge!=="undefined" && AndroidBridge.setActiveRoom){ try{ AndroidBridge.setActiveRoom(topic); }catch(e){} }
}
function renderChatFull(topic){
  const box=$("messages"); box.innerHTML="";
  let msgs=getMsgs(topic);
  if(searchInChat){ msgs=msgs.filter(m=>(m.text||"").toLowerCase().includes(searchInChat)); }
  let prev=null;
  msgs.forEach(m=>{
    if(showNewDivider && newMsgFrom>0 && prev && prev.time<=newMsgFrom && m.time>newMsgFrom){
      const nd=document.createElement("div"); nd.className="divider newdiv"; nd.textContent="以下为新消息"; box.appendChild(nd);
    }
    if(needDivider(prev,m)){ const d=document.createElement("div"); d.className="divider"; d.textContent=fmtDivider(m.time); box.appendChild(d); }
    box.appendChild(bubbleEl(m));
    prev=m;
  });
  showNewDivider=false;
  newCount=0; updateJumpBadge(); const jb=$("jumpLatest"); if(jb) jb.classList.remove("show"); atBottom=true;
  scrollBottom();

// 高亮 @名字（@自己 用红色）
function highlightAt(html){
  if(!html) return html;
  return html.replace(/@([^\s@，。、！？,!?]{1,20})/g, (full, name)=>{
    const me = (myName && name===myName);

// 引用回复：用 \u0001Q<json>\u0001 包裹在消息体里，便于跨端还原
function parseQuote(body){
  if(body && body.length>3 && body.charCodeAt(0)===1 && body.charAt(1)==="Q"){
    const end=body.indexOf("\u0001",2);
    if(end>2){ try{ const q=JSON.parse(body.slice(2,end)); return {text:body.slice(end+1), quote:q}; }catch(e){} }
  }
  return {text:body, quote:null};
}
function embedQuote(body, quote){
  if(!quote) return body;
  return "\u0001Q"+JSON.stringify({i:quote.id||"", n:quote.name||"", t:quote.text||""})+"\u0001"+body;
}
// 合并转发：\u0001M<json>\u0001 包裹消息数组
function parseMerge(body){
  if(body && body.length>3 && body.charCodeAt(0)===1 && body.charAt(1)==="M"){
    const end=body.indexOf("\u0001",2);
    if(end>2){ try{ return {ok:true, items:JSON.parse(body.slice(2,end))}; }catch(e){} }
  }
  return {ok:false};
}

// 长按（触摸/鼠标）触发回调
function attachLongPress(el, cb){
  let timer=null;
  const start=()=>{ timer=setTimeout(()=>{ timer=null; cb(); }, 480); };
  const cancel=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener("contextmenu",(e)=>{ e.preventDefault(); cb(); });
  el.addEventListener("touchstart",start,{passive:true});
  el.addEventListener("touchend",cancel);
  el.addEventListener("touchmove",cancel);
  el.addEventListener("touchcancel",cancel);
  el.addEventListener("mousedown",start);
  el.addEventListener("mouseup",cancel);
  el.addEventListener("mouseleave",cancel);
}

  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  if(id==="screenChats") renderChats();
  if(id==="screenContacts") renderContacts();
  if(id==="screenMe") renderMe();
}
function updateTabBadge(){
  const total=chats.reduce((a,c)=>a+(c.unread||0),0);
  const b=$("tabBadge");
  if(total>0){ b.style.display="flex"; b.textContent=total>99?"99+":total; } else b.style.display="none";
  const mar=$("markAllRead"); if(mar) mar.style.display = total>0 ? "" : "none";
}

function notify(title, body){

  if(Notification.permission==="granted"){ try{ new Notification(title,{body:body,tag:"fc"}); }catch(e){} }
}

// ---------- 新消息提示音 + 振动（纯本地，尊重「新消息通知」开关） ----------
let _actx=null;
function _initAudio(){ try{ if(!_actx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) _actx=new AC(); } if(_actx && _actx.state==="suspended") _actx.resume(); }catch(e){} }
function _unlockAudio(){ _initAudio(); }
function _cueSound(){
  try{
    _initAudio();
    if(!_actx) return;
    if(_actx.state==="suspended"){ _actx.resume(); }
    const t=_actx.currentTime;
    const o=_actx.createOscillator(), g=_actx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(660, t+0.12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.20);
    o.connect(g); g.connect(_actx.destination);
    o.start(t); o.stop(t+0.22);
  }catch(e){}
}
// 提示开关由「新消息通知」统一控制（fc_cue），在 APK 的 WebView 中 Notification 不可用也能生效
function playNewMsgCue(topic){
  try{
    if(!lsGet("fc_cue", true)) return;           // 尊重「新消息通知」开关
    const c=getChat(topic);
    if(c && c.mute) return;                       // 免打扰不响
    _cueSound();
    const viewing = (topic===activeTopic && !document.hidden);
    if(!viewing && navigator.vibrate) navigator.vibrate(30); // 仅在非当前查看会话时振动
  }catch(e){}
}

function syncNative(){
  if(typeof AndroidBridge!=="undefined"){
    try{
      AndroidBridge.setUid(uid);
      if(AndroidBridge.setRooms) AndroidBridge.setRooms(JSON.stringify(chats.map(c=>({topic:c.topic, name:c.name, mute:!!c.mute}))));
      else if(AndroidBridge.setRoom && chats[0]) AndroidBridge.setRoom(chats[0].topic);
    }catch(e){}
  }
}

let lastTyping=0;
function sendTyping(){
  if(!activeTopic) return;
  const now=Date.now();
  if(now-lastTyping < 2500) return;
  lastTyping=now;
  try{ fetch(BASE+"/"+activeTopic, {method:"POST", headers:{ "Title":encTitle(myName||"我"), "Tags":uid+",typing", "Priority":"min" }, body:"1"}); }catch(e){}
}

// @ 提醒选择器
let atPickerNames=[];
function onComposerInput(ta){
  sendTyping();
  const pos=ta.selectionStart||ta.value.length;
  const before=ta.value.slice(0,pos);
  const m=before.match(/@([^\s@，。、！？,!?]*)$/);
  if(m){
    const q=m[1].toLowerCase();
    const names=knownNames(activeTopic).filter(n=>n.toLowerCase().indexOf(q)>=0).slice(0,8);
    if(names.length){ showAtPicker(names, ta); } else hideAtPicker();
  } else hideAtPicker();
}
function knownNames(topic){
  const set={}; const out=[];
  getMsgs(topic).forEach(x=>{ if(x.name && !x.self && x.name!==myName && !set[x.name]){ set[x.name]=1; out.push(x.name); } });
  return out;
}
function showAtPicker(names, ta){
  atPickerNames=names; const pop=$("atPop"); pop.innerHTML="";
  names.forEach(n=>{ const d=document.createElement("div"); d.textContent=n; d.onclick=()=>insertAtName(n, ta); pop.appendChild(d); });
  pop.classList.add("show");
}
function hideAtPicker(){ const pop=$("atPop"); if(pop) pop.classList.remove("show"); }
function insertAtName(name, ta){
  const pos=ta.selectionStart||ta.value.length;
  const before=ta.value.slice(0,pos);
  const after=ta.value.slice(pos);
  const m=before.match(/@([^\s@，。、！？,!?]*)$/);
  let start=m? before.length-m[0].length : before.length;
  const nv=before.slice(0,start)+"@"+name+" "+after;
  ta.value=nv;
  const np=start+name.length+2;
  ta.setSelectionRange(np,np);
  ta.focus(); autoGrow(ta); hideAtPicker();
}

const EMOJIS="😀 😁 😂 🤣 😊 😍 😘 😎 🤔 😅 😭 😡 👍 👎 👌 🙏 💪 ❤️ 💔 🎉 🔥 ✨ 🌹 🍺 🍎 🐶 🐱 🌟 😴 🤝 💡 ⚽ 🎁 ☕ 🌈 😉 😢 😏 😜 🥰 😇 🤩 🥳 😤 🤯 🙄 😬 🤤 😋 😴 🤗 🤭 🫡 🤝 👏 🙌 👋 🤙 💯 ✅ 🆗 🈶 🈚 💢 💥 💫 ⭐ 🌟 💎 🔔 📣 📱 💬 📷 🎬 🎵 🍻 🍜 🍔 🍟 🌭 🍿 🍰 🍩 🍪 🍉 🍓 🍑 🥑 🌻 🌈 ☀️ 🌙 ⛅ ☁️ ❄️ 💧 🔥".split(" ");

let _emojiTab="emoji";
function buildEmoji(){
  const p=$("emojiPanel"); if(!p) return; p.innerHTML="";
  const tabs=document.createElement("div"); tabs.className="emoji-tabs";
  const t1=document.createElement("div"); t1.className="emoji-tab"+(_emojiTab==="emoji"?" active":""); t1.textContent="表情"; t1.onclick=()=>{ _emojiTab="emoji"; buildEmoji(); };
  const t2=document.createElement("div"); t2.className="emoji-tab"+(_emojiTab==="stickers"?" active":""); t2.textContent="我的"; t2.onclick=()=>{ _emojiTab="stickers"; buildEmoji(); };
  tabs.appendChild(t1); tabs.appendChild(t2); p.appendChild(tabs);
  const grid=document.createElement("div"); grid.className="emoji-grid"; p.appendChild(grid);
  if(_emojiTab==="emoji"){
    const recent=lsGet("fc_recent_emoji",[]);
    if(recent.length){ recent.forEach(e=>{ const s=document.createElement("span"); s.textContent=e; s.onclick=()=>{ const ta=$("text"); ta.value+=e; ta.focus(); autoGrow(ta); }; grid.appendChild(s); }); }
    EMOJIS.forEach(e=>{ const s=document.createElement("span"); s.textContent=e; s.onclick=()=>{ const ta=$("text"); ta.value+=e; ta.focus(); autoGrow(ta); addRecentEmoji(e); }; grid.appendChild(s); });
  } else {
    const st=lsGet("fc_stickers",[]);
    if(st.length){ st.forEach(sk=>{ const img=document.createElement("img"); img.className="emoji-sticker"; img.src=sk.data; img.title=sk.name||"表情"; img.onclick=()=>sendSticker(sk); grid.appendChild(img); }); }
    const add=document.createElement("div"); add.className="emoji-sticker-add"; add.textContent="＋"; add.onclick=()=>$("stickerFile").click(); grid.appendChild(add);
    if(!st.length){ const tip=document.createElement("div"); tip.style.cssText="width:100%;font-size:12px;color:#999;padding:6px 2px"; tip.textContent="点 ＋ 把图片加为表情"; grid.appendChild(tip); }
  }
}
function hideEmoji(){ const p=$("emojiPanel"); if(p) p.classList.remove("show"); }
function sendSticker(sk){
  if(!activeTopic){ toast("请先进入一个聊天"); return; }
  hideEmoji();
  sendImageMsg(activeTopic, sk.data, sk.w||0, sk.h||0);
}
function addStickerFile(file){
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=200; let w=img.width, h=img.height;
      if(!w||!h){ toast("图片无法读取"); return; }
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>max){ w=Math.round(w*max/h); h=max; }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      let out=cv.toDataURL("image/jpeg",0.82);
      if(out.length>120000) out=cv.toDataURL("image/jpeg",0.6);
      const st=lsGet("fc_stickers",[]);
      st.push({id:"sk-"+Date.now()+"-"+Math.random().toString(36).slice(2,6), data:out, name:"表情", w, h});
      lsSet("fc_stickers", st);
      _emojiTab="stickers"; buildEmoji();
      toast("已添加表情");
    };
    img.onerror=()=>toast("图片无法读取");
    img.src=reader.result;
  };
  reader.onerror=()=>toast("读取失败");
  reader.readAsDataURL(file);
}
$("emojiBtn").onclick=()=>{ const p=$("emojiPanel"); buildEmoji(); p.classList.toggle("show"); if(p.classList.contains("show")) $("text").blur(); };
$("stickerFile").onchange=(e)=>{ const f=e.target.files&&e.target.files[0]; addStickerFile(f); e.target.value=""; };
$("imgBtn").onclick=()=>{ $("imgFile").click(); };
$("imgFile").onchange=(e)=>{

  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=800; let w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>max){ w=Math.round(w*max/h); h=max; }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      let out=cv.toDataURL("image/jpeg",0.8);
      if(out.length>600000) out=cv.toDataURL("image/jpeg",0.6);
      sendImageMsg(activeTopic, out, w, h);
    };
    img.onerror=()=>toast("图片无法读取");
    img.src=r.result;
  };
  r.onerror=()=>toast("读取失败");
  r.readAsDataURL(f);
  e.target.value="";
};

  chats = chats.filter(c=>c.topic!==topic);
  closeUnified(); ensureConnection(); // 重建统一 SSE，剔除已删会话
  saveChats(); syncNative(); updateTabBadge();
  activeTopic=null; showScreen("screenChats"); renderChats();
}

function createGroup(){
  promptDialog("发起群聊","给群聊起个名字（如：一家老小）","",(name)=>{
    name=(name||"").trim()||"群聊";
    const topic = "fg"+Math.random().toString(36).slice(2,12);
    const c=mkChat(name, topic); c.type="group";
    c.members=[{uid:uid, name:myName||"我"}];
    chats.unshift(c); saveChats(); syncNative();
    connectTopic(topic); renderChats(); updateTabBadge();
    showInvite(c);
    toast("群聊已创建，把邀请发给家人即可多人聊天");
  });
}
function createChat(){
  promptDialog("发起新聊天","给这个聊天起个名字（如：家庭群聊）","",(name)=>{
    name=(name||"").trim()||"新聊天";
    const topic = "fc"+Math.random().toString(36).slice(2,12);
    const c=mkChat(name, topic); chats.unshift(c); saveChats(); syncNative();
    connectTopic(topic); renderChats(); updateTabBadge();
