<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>家聊</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --wx-green:#07C160; --wx-green-dark:#06A652;
    --wx-bg:#ededed; --wx-self:#95EC69; --wx-other:#ffffff;
    --wx-bar:#f7f7f7; --wx-bar-line:#d9d9d9;
    --wx-line:#e6e6e6; --wx-text:#191919; --wx-muted:#9a9a9a;
    --wx-red:#fa5151; --wx-blue:#576b95;
    --tab-h:54px; --header-h:48px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --wx-card:#ffffff; --wx-panel:#f2f2f2; --wx-input:#e3e3e3; --wx-active:#ececec;
    --msg-font:15px;
  }
  [data-theme="dark"]{
    --wx-bg:#0f0f0f; --wx-self:#2b6a4f; --wx-other:#2a2a2a;
    --wx-bar:#1b1b1b; --wx-bar-line:#2a2a2a; --wx-line:#2a2a2a;
    --wx-text:#e8e8e8; --wx-muted:#8a8a8a;
    --wx-card:#1f1f1f; --wx-panel:#1f1f1f; --wx-input:#2a2a2a; --wx-active:#2a2a2a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#c9c9c9;color:var(--wx-text);
    display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  /* 手机外壳：桌面居中，移动端全屏 */
  #phone{
    width:100%;max-width:430px;height:100dvh;max-height:100dvh;
    background:var(--wx-bg);display:flex;flex-direction:column;position:relative;overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.25);
  }
  .screen{flex:1;display:none;flex-direction:column;min-height:0;background:var(--wx-bg)}
  .screen.active{display:flex}
  /* 顶部栏 */
  .header{
    height:var(--header-h);flex:0 0 auto;display:flex;align-items:center;
    background:var(--wx-bar);border-bottom:1px solid var(--wx-bar-line);
    padding:0 8px;position:relative;z-index:5;
  }
  .header .title{font-size:17px;font-weight:600;flex:1;text-align:center}
  .header .left,.header .right{
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    color:#181818;cursor:pointer;flex:0 0 auto;
  }
  .header .right.action{font-size:15px;color:var(--wx-green);width:auto;padding:0 6px}
  .header .right.disabled{opacity:.4}
  /* 微信页搜索 */
  .searchbar{padding:8px 12px;background:var(--wx-bar);flex:0 0 auto}
  .searchbar input{
    width:100%;border:none;background:var(--wx-input);border-radius:8px;
    padding:8px 12px;font-size:14px;outline:none;text-align:center;color:var(--wx-text);
  }
  .searchbar input::placeholder{color:var(--wx-muted)}
  .list{flex:1;overflow:auto;background:var(--wx-card);-webkit-overflow-scrolling:touch}
  /* 会话项 */
  .item{display:flex;align-items:center;padding:11px 14px;position:relative;cursor:pointer;background:var(--wx-card)}
  .item:active{background:var(--wx-active)}
  .item+.item::before{content:"";position:absolute;top:0;left:68px;right:0;height:1px;background:var(--wx-line)}
  .avatar{
    width:46px;height:46px;border-radius:8px;flex:0 0 auto;color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;
    margin-right:12px;overflow:hidden;
  }
  .item .mid{flex:1;min-width:0}
  .item .name{font-size:16px;color:var(--wx-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .preview{font-size:13px;color:var(--wx-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .item .rightcol{display:flex;flex-direction:column;align-items:flex-end;margin-left:8px;flex:0 0 auto}
  .item .time{font-size:11px;color:var(--wx-muted);margin-bottom:6px}
  .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--wx-red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
  /* 空态 */
  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9a9a9a;text-align:center;padding:40px}
  .empty .big{font-size:46px;margin-bottom:14px;opacity:.5}
  .empty .btn{margin-top:18px;background:var(--wx-green);color:#fff;border:none;border-radius:6px;padding:9px 22px;font-size:15px;cursor:pointer}
  /* 底部 Tab */
  .tabbar{
    height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);
    flex:0 0 auto;display:flex;background:var(--wx-bar);border-top:1px solid var(--wx-bar-line);
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8a8a8a;font-size:11px;cursor:pointer;position:relative}
  .tab.active{color:var(--wx-green)}
  .tab svg{width:24px;height:24px}
  .tab .tab-badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--wx-red);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
  /* 聊天页 */
  #chatScreen{background:var(--wx-bg);position:relative}
  .messages{flex:1;overflow:auto;padding:10px 10px 4px;-webkit-overflow-scrolling:touch}
  .divider{text-align:center;margin:12px 0;font-size:12px;color:#9a9a9a}
  .row{display:flex;margin:10px 4px;align-items:flex-start}
  .row.me{flex-direction:row-reverse}
  .row .av{width:38px;height:38px;border-radius:6px;flex:0 0 auto;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600}
  .row .bubble{
    max-width:68%;margin:0 10px;padding:9px 12px;font-size:var(--msg-font,15px);line-height:1.45;border-radius:6px;
    position:relative;word-break:break-word;white-space:pre-wrap;
  }
  .row.other .bubble{background:var(--wx-other)}
  .row.me .bubble{background:var(--wx-self)}
  .row .bubble::before{content:"";position:absolute;top:13px;width:0;height:0;border:6px solid transparent}
  .row.other .bubble::before{left:-11px;border-right-color:var(--wx-other)}
  .row.me .bubble::before{right:-11px;border-left-color:var(--wx-self)}
  .row .sender{font-size:11px;color:#9a9a9a;margin:0 10px 2px}
  .row.me .sender{text-align:right}
  /* 输入栏 */
  .composer{
    flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;padding:7px 10px;background:var(--wx-bar);
    border-top:1px solid var(--wx-bar-line);padding-bottom:calc(7px + var(--safe-b));
  }
  .composer .ic{width:34px;height:34px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#3a3a3a;cursor:pointer;font-size:22px}
  .composer textarea{
    flex:1;border:none;background:var(--wx-card);border-radius:6px;padding:8px 10px;font-size:15px;color:var(--wx-text);
    outline:none;resize:none;max-height:90px;min-height:34px;line-height:1.4;font-family:inherit;
  }
  .composer .send{
    flex:0 0 auto;background:var(--wx-green);color:#fff;border:none;border-radius:6px;
    padding:0 16px;height:34px;font-size:14px;cursor:pointer
  }
  .composer .send:disabled{opacity:.5}
  /* 表情面板 */
  .emoji-panel{display:none;flex-wrap:wrap;gap:4px;padding:10px;background:var(--wx-panel);border-top:1px solid var(--wx-bar-line);max-height:160px;overflow:auto}
  .emoji-panel.show{display:flex}
  .emoji-panel span{font-size:24px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px}
  .emoji-panel span:active{background:var(--wx-active)}
  /* 通讯录分组标题 */
  .group-title{padding:8px 14px;font-size:12px;color:#9a9a9a;background:var(--wx-bg)}
  /* 我 */
  .me-top{background:var(--wx-bar);padding:26px 18px;display:flex;align-items:center;gap:16px}
  .me-top .avatar{width:60px;height:60px;border-radius:10px;font-size:26px}
  .me-top .mn{font-size:20px;font-weight:600}
  .me-top .mid2{color:#9a9a9a;font-size:13px;margin-top:4px}
  .menu{background:var(--wx-card);margin-top:10px}
  .menu .mi{display:flex;align-items:center;padding:14px 16px;justify-content:space-between;cursor:pointer;font-size:15px;background:var(--wx-card)}
  .menu .mi:active{background:var(--wx-active)}
  .menu .mi+.mi{border-top:1px solid var(--wx-line)}
  .menu .mi .v{color:var(--wx-muted);font-size:14px}
  .menu .mi .chev{color:#c0c0c0;font-size:16px;margin-left:8px}
  /* 遮罩 + 弹窗 */
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end}
  .mask.show{display:flex}
  .sheet{width:100%;background:var(--wx-panel);border-radius:14px 14px 0 0;overflow:hidden;animation:up .2s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet .opt{padding:16px;text-align:center;background:#fff;font-size:17px;color:var(--wx-text);cursor:pointer}
  .sheet .opt:active{background:#ececec}
  .sheet .opt.danger{color:var(--wx-red)}
  .sheet .opt+.opt{border-top:1px solid var(--wx-line)}
  .sheet .cancel{margin-top:8px;background:#fff;padding:16px;text-align:center;font-size:17px;font-weight:600;cursor:pointer;color:var(--wx-text)}
  /* 居中对话框 */
  .dialog{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;z-index:30;align-items:center;justify-content:center;padding:30px}
  .dialog.show{display:flex}
  .card{width:100%;max-width:300px;background:var(--wx-card);border-radius:12px;overflow:hidden}
  .card .ct{padding:20px 18px 6px;font-size:16px;font-weight:600;text-align:center}
  .card .cb{padding:6px 18px 16px;color:#555;font-size:14px;text-align:center;line-height:1.6}
  .card input{width:calc(100% - 36px);margin:4px 18px 0;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:15px;outline:none}
  .card .cactions{display:flex;border-top:1px solid var(--wx-line);margin-top:16px}
  .card .cactions button{flex:1;padding:13px;border:none;background:#fff;font-size:16px;cursor:pointer;color:var(--wx-green)}
  .card .cactions button:active{background:#f0f0f0}
  .card .cactions button+button{border-left:1px solid var(--wx-line)}
  .card .cactions button.ghost{color:#555}
  .codebox{background:var(--wx-input);border-radius:8px;padding:10px;margin:10px 18px 4px;font-size:13px;word-break:break-all;color:var(--wx-text);user-select:all}
  .linkbox{font-size:12px;color:var(--wx-blue);word-break:break-all;padding:0 18px;margin-bottom:8px;user-select:all}
  /* 微信启动首屏 */
  #splash{position:absolute;inset:0;background:#ededed;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50}
  #splash .logo{width:80px;height:80px;border-radius:18px;background:var(--wx-green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:700;box-shadow:0 6px 20px rgba(7,193,96,.4)}
  #splash .tip{margin-top:18px;color:#9a9a9a;font-size:14px}
  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:60;display:none;max-width:80%;text-align:center}
  .toast.show{display:block}
  .statusbar{position:absolute;top:0;left:0;right:0;height:0;z-index:9}
  /* 发送状态 / @ / 打字 / 搜索 / 字体 */
  .row.me .st{align-self:center;margin:0 6px;font-size:12px;color:#9a9a9a;cursor:default;flex:0 0 auto}
  .row.me .st.fail{color:var(--wx-red);cursor:pointer}
  .at{color:#576b95;font-weight:600}
  .at.me{color:var(--wx-red)}
  .typing-bar{height:24px;display:none;align-items:center;justify-content:center;font-size:12px;color:var(--wx-muted);background:var(--wx-bg);flex:0 0 auto}
  .typing-bar.show{display:flex}
  .typing-bar .dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--wx-muted);margin:0 2px;animation:blink 1s infinite}
  .typing-bar .dot:nth-child(2){animation-delay:.2s}
  .typing-bar .dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .at-pop{position:absolute;left:8px;right:8px;bottom:56px;max-height:190px;overflow:auto;background:var(--wx-card);border:1px solid var(--wx-line);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none;z-index:15}
  .at-pop.show{display:block}
  .at-pop div{padding:11px 14px;font-size:15px;cursor:pointer;border-bottom:1px solid var(--wx-line)}
  .at-pop div:last-child{border-bottom:none}
  .at-pop div:active{background:var(--wx-active)}
  .search-banner{display:none;align-items:center;justify-content:space-between;padding:7px 14px;background:#d9e6f7;color:#3a6ea5;font-size:13px;flex:0 0 auto}
  .search-banner.show{display:flex}
  .search-banner .clear{cursor:pointer;font-weight:600}
  /* 引用回复条 + 气泡内引用块 + 收藏 */
  .quote-bar{display:none;align-items:center;background:var(--wx-bar);border-top:1px solid var(--wx-bar-line);padding:8px 12px;flex:0 0 auto}
  .quote-bar.show{display:flex}
  .qb-text{flex:1;font-size:13px;color:var(--wx-muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .qb-close{margin-left:10px;color:#888;font-size:16px;cursor:pointer;padding:0 4px}
  .bubble .quote{background:rgba(0,0,0,.05);border-left:3px solid var(--wx-blue);border-radius:4px;padding:5px 8px;margin-bottom:6px;font-size:12px;color:var(--wx-muted);line-height:1.4}
  .bubble .quote .qn{color:var(--wx-blue);margin-bottom:2px}
  .bubble .quote .qt{white-space:pre-wrap;word-break:break-word}
  .fav-list{max-height:60vh;overflow:auto}
  .fav-item{padding:12px 16px;border-bottom:1px solid var(--wx-line);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .fav-item .fa{margin-top:6px;display:flex;gap:14px;font-size:13px;color:var(--wx-green)}
  .fav-item .fa span{cursor:pointer}
  .emoji-recent{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px;border-bottom:1px solid var(--wx-line);background:var(--wx-panel)}
  .emoji-recent span{font-size:20px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  /* 回到最新 悬浮按钮 */
  .jump-latest{position:absolute;right:14px;bottom:74px;width:42px;height:42px;border-radius:50%;background:var(--wx-card);box-shadow:0 2px 10px rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;font-size:20px;color:var(--wx-green);cursor:pointer;z-index:12;border:1px solid var(--wx-line)}
  .jump-latest.show{display:flex}
  .jl-badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--wx-red);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid var(--wx-card)}
  /* 拍一拍 居中系统提示 */
  .row.sys{justify-content:center;margin:6px 4px}
  .sys-line{background:rgba(0,0,0,.06);color:var(--wx-muted);font-size:12px;padding:3px 10px;border-radius:6px;max-width:80%;text-align:center}
  [data-theme="dark"] .sys-line{background:rgba(255,255,255,.08);color:#aaa}
  /* 聊天置顶消息横幅 */
  .pin-bar{display:none;align-items:center;background:#fffbe6;border-top:1px solid var(--wx-line);border-bottom:1px solid var(--wx-line);padding:6px 10px;font-size:13px;color:#8a6d3b;flex:0 0 auto}
  .pin-bar.show{display:flex}
  .pin-bar .pin-ico{margin-right:6px;flex:0 0 auto}
  .pin-bar .pin-text{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
  .pin-bar .pin-close{margin-left:8px;color:#bbb;cursor:pointer;padding:0 4px;flex:0 0 auto}
  [data-theme="dark"] .pin-bar{background:#3a3320;color:#d8c9a0}
  /* 已读回执 */
  .row.me .st.read{color:var(--wx-muted)}
  /* 大表情（单/少量 emoji 放大显示） */
  .bubble.big-emoji{background:transparent!important;font-size:46px;line-height:1.25;padding:2px 2px;max-width:62%;box-shadow:none}
  .bubble.big-emoji::before{display:none}
  .row.other .bubble.big-emoji{background:transparent!important}
  /* 引用块可点击定位原消息 */
  .bubble .quote{cursor:pointer}
  /* 以下为新消息 分割线 */
  .divider.newdiv{color:var(--wx-red);font-weight:600}
  /* 聊天背景预设 */
  #chatScreen.bg-default, #messages.bg-default{background:var(--wx-bg)}
  #chatScreen.bg-green, #messages.bg-green{background:#e6f4ea}
  #chatScreen.bg-blue, #messages.bg-blue{background:#e7f0fb}
  #chatScreen.bg-paper, #messages.bg-paper{background:#f3ecd9}
  #chatScreen.bg-dark, #messages.bg-dark{background:#1a1a1a}
  /* 多选转发 */
  .row.selected .bubble{outline:2px solid var(--wx-green);outline-offset:1px}
  #chatScreen.selecting .composer, #chatScreen.selecting .emoji-panel, #chatScreen.selecting .quote-bar{display:none}
  .sel-bar{display:none;position:absolute;left:0;right:0;bottom:0;background:var(--wx-bar);border-top:1px solid var(--wx-bar-line);padding:10px 14px;align-items:center;justify-content:space-between;z-index:14;flex:0 0 auto;padding-bottom:calc(10px + var(--safe-b))}
  .sel-bar.show{display:flex}
  .sel-bar .sel-acts{display:flex;gap:18px;font-size:15px;color:var(--wx-green)}
  .sel-bar .sel-acts span{cursor:pointer}
  /* 合并转发卡片 */
  .bubble.merge{background:var(--wx-other);max-width:74%;cursor:pointer}
  .merge-title{font-size:14px;font-weight:600;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(0,0,0,.06)}
  .merge-item{font-size:13px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin:3px 0}
  [data-theme="dark"] .merge-item{color:#ddd}
  .merge-item .mi-name{color:var(--wx-blue)}
  .merge-more{font-size:13px;color:#999}
  .merge-foot{font-size:12px;color:#999;margin-top:6px;padding-top:6px;border-top:1px solid rgba(0,0,0,.06)}
</style>
</head>
<body>
<div id="phone">
  <!-- 启动屏 -->
  <div id="splash">
    <div class="logo">聊</div>
    <div class="tip">家聊 · 加载中…</div>
  </div>

  <!-- 微信（会话列表） -->
  <div class="screen active" id="screenChats">
    <div class="header">
      <div class="title">微信</div>
      <div class="right" id="addBtn" title="发起/加入聊天">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#181818" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>
    <div class="searchbar"><input id="searchInput" placeholder="搜索"></div>
    <div class="list" id="chatList"></div>
  </div>

  <!-- 聊天详情 -->
  <div class="screen" id="chatScreen">
    <div class="header">
      <div class="left" id="backBtn">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#181818" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="title" id="chatTitle">聊天</div>
      <div class="right action" id="chatMore">···</div>
    </div>
    <div class="typing-bar" id="typingBar"><span id="typingName">对方</span> 正在输入<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="search-banner" id="searchBanner"><span id="searchInfo">搜索</span><span class="clear" id="searchClear">清除</span></div>
    <div class="pin-bar" id="pinBar"><span class="pin-ico">📌</span><div class="pin-text" id="pinText"></div><div class="pin-close" id="pinClose">✕</div></div>
    <div class="messages" id="messages"></div>
    <div class="jump-latest" id="jumpLatest"><span class="jl-badge" id="jumpNew" style="display:none">0</span>↓</div>
    <div class="at-pop" id="atPop"></div>
    <div class="quote-bar" id="quoteBar"><div class="qb-text" id="qbText"></div><div class="qb-close" id="qbClose">✕</div></div>
    <div class="emoji-panel" id="emojiPanel"></div>

<script src="push.js"></script>
<script>
"use strict";
const BASE = "https://ntfy.sh";
const $ = (id)=>document.getElementById(id);
const PAL = ["#07C160","#10AEFF","#FF9C19","#FA5151","#6467EF","#13C2C2","#EB2EFF","#FF6B9D","#07C160","#5C6BC0"];

function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

// ---------- 身份 ----------
let uid = localStorage.getItem("fc_uid");
if(!uid){ uid = "u"+Math.random().toString(36).slice(2,10); localStorage.setItem("fc_uid",uid); }
let myName = localStorage.getItem("fc_name") || "";

// ---------- 会话数据（多会话） ----------
let chats = lsGet("fc_chats", null);
if(chats===null){
  const oldTopic = localStorage.getItem("fc_topic");
  chats = [];
  if(oldTopic){ chats.push(mkChat("家庭群聊", oldTopic)); }
  lsSet("fc_chats", chats);
}
function mkChat(name, topic){
  return { name, topic, color: colorFrom(topic), unread:0, lastMsg:"", lastTime:0, order:Date.now(), pinned:false, mute:false };
}
function colorFrom(str){ let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))>>>0; return PAL[h%PAL.length]; }
function saveChats(){ lsSet("fc_chats", chats); }
function getChat(topic){ return chats.find(c=>c.topic===topic); }

// ---------- 消息存储 ----------
function msgKey(t){ return "fc_msgs_"+t; }
function getMsgs(t){ return lsGet(msgKey(t), []); }
function setMsgs(t,m){ lsSet(msgKey(t), m); }
function lastKey(t){ return "fc_last_"+t; }
function getLast(t){ return lsGet(lastKey(t), 1); }

// ---------- 工具 ----------
function escapeHtml(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
// 是否为「大表情」：纯 emoji 且 1~3 个（微信式贴纸放大显示）
function isBigEmoji(text){
  if(!text) return false;
  const t=text.trim();
  if(!t) return false;
  const cps=[...t];
  if(cps.length<1 || cps.length>3) return false;
  const ranges=[[0x2190,0x21FF],[0x2300,0x27BF],[0x2B00,0x2BFF],[0x2600,0x26FF],[0x2700,0x27BF],[0x1F000,0x1FAFF],[0xFE00,0xFE0F]];
  return cps.every(c=>{ const cp=c.codePointAt(0); if(cp===0x200D||cp===0x20E3) return true; return ranges.some(([a,b])=>cp>=a&&cp<=b); });
}
function fmtTime(ts){
  ts = ts*1000;
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString()===now.toDateString();
  const yest = new Date(now); yest.setDate(now.getDate()-1);
  const pad = n=>String(n).padStart(2,"0");
  const hm = pad(d.getHours())+":"+pad(d.getMinutes());
  if(sameDay) return hm;
  if(d.toDateString()===yest.toDateString()) return "昨天 "+hm;
  return (d.getMonth()+1)+"月"+d.getDate()+"日 "+hm;
}
function sameDayTs(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function weekdayName(d){ const w=["周日","周一","周二","周三","周四","周五","周六"]; return w[d.getDay()]; }
function fmtDivider(ts){
  const d=new Date(ts*1000), now=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const hm=pad(d.getHours())+":"+pad(d.getMinutes());
  const y=new Date(now); y.setDate(now.getDate()-1);
  if(sameDayTs(d,now)) return "今天 "+hm;
  if(sameDayTs(d,y)) return "昨天 "+hm;
  const diff=Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()-new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime())/86400000);
  if(diff<=7) return weekdayName(d)+" "+hm;
  if(d.getFullYear()===now.getFullYear()) return (d.getMonth()+1)+"月"+d.getDate()+"日 "+hm;
  return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 "+hm;
}
// 同天或间隔>5分钟才显示时间分割线（微信式）
function needDivider(prev,cur){
  if(!prev) return true;
  if(!sameDayTs(new Date(prev.time*1000), new Date(cur.time*1000))) return true;
  return (cur.time-prev.time) > 300;
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1400);
}
function avatarText(name){ return (name||"?").trim().charAt(0) || "?"; }

// ---------- 连接管理（每会话一个 SSE） ----------
const esMap = {};
function connectTopic(topic){
  if(esMap[topic]) return;
  loadHistory(topic);
  try{
    const es = new EventSource(BASE+"/"+topic+"/sse");
    es.onmessage = (e)=>{ try{ handleIncoming(topic, JSON.parse(e.data)); }catch(_){} };
    es.onerror = ()=>{ /* 浏览器会自动重连 */ };
    esMap[topic] = es;
    shareSubscription(topic);
  }catch(e){}
}
function connectAll(){ chats.forEach(c=>connectTopic(c.topic)); }
function loadHistory(topic){
  const since = getLast(topic);
  fetch(BASE+"/"+topic+"/json?since="+since).then(r=>r.json()).then(arr=>{
    (arr||[]).forEach(m=>handleIncoming(topic, m, true));
    const mx = (arr||[]).reduce((a,m)=>Math.max(a, m.time||0), since);
    if(mx>since) lsSet(lastKey(topic), mx);
  }).catch(()=>{});
}
async function shareSubscription(topic){
  if(!window.FC_PUSH) return;
  try{
    const sub = await FC_PUSH.subscribePush();
    if(sub){ await fetch(BASE+"/"+topic, {method:"POST", headers:{"Title":"sub","Tags":"sub"+uid,"Priority":"min"}, body: JSON.stringify(sub)}); }
  }catch(e){}
}
function handleIncoming(topic, m, fromHistory){
  if(!m || m.event!=="message") return;
  const tags = m.tags||[];
  // 收集他人 Web Push 订阅端点
  if(tags.includes("sub")){
    try{ const s=JSON.parse(m.message); if(s&&s.endpoint){ const arr=lsGet("fc_subs_"+topic,[]); arr.push(s); lsSet("fc_subs_"+topic, dedupeSubs(arr)); } }catch(e){}
    return;
  }
  const sender = (tags&&tags[0])||"";
  // 拍一拍 控制消息：仅对方发来的渲染（自己的回声在此前已本地渲染）
  const patTagIdx = (tags||[]).findIndex(t=>typeof t==="string" && t.indexOf("pat_")===0);
  if(patTagIdx>=0){ if(sender!==uid){ try{ const p=JSON.parse(m.message||"{}"); addPatLine(topic, p.from, p.to); }catch(e){} } return; }
  // 已读回执：对方读到你发的消息
  const readTagIdx = (tags||[]).findIndex(t=>typeof t==="string" && t.indexOf("read_")===0);
  if(readTagIdx>=0){ if(sender!==uid){ try{ const ts=parseFloat(m.message||"0"); if(ts>0) markRead(topic, ts); }catch(e){} } return; }
  // 置顶消息同步
  const pinTagIdx = (tags||[]).findIndex(t=>typeof t==="string" && t.indexOf("pin_")===0);
  if(pinTagIdx>=0){
    if(sender!==uid){
      const c=getChat(topic);
      if(c){ if(m.message){ try{ c.pinned=JSON.parse(m.message); }catch(e){ c.pinned=null; } } else c.pinned=null; saveChats(); if(topic===activeTopic) renderPin(); }
    }
    return;
  }
  if(sender===uid) return; // 跳过自己（含撤回/打字回声）
  // 撤回控制消息：tags 含 recall_<id>
  const recallTag = tags.find(t=>typeof t==="string" && t.indexOf("recall_")===0);
  if(recallTag){ recallMessage(topic, recallTag.slice("recall_".length)); return; }
  // 打字指示器（仅实时消息，历史回放忽略）
  if(tags.includes("typing") && !fromHistory){ showTyping(topic, m.title||"对方"); return; }
  const parsed = parseQuote(m.message||"");
  const pm = parseMerge(parsed.text);
  if(pm.ok){ addLocalMsg(topic, {id:m.id, sender, name:m.title||"对方", text:"", merge:pm.items, time:(m.time||Date.now()/1000), self:false, mentioned:false}, {silentUnread:false}); return; }
  const mentioned = !!myName && myName.length>0 && parsed.text.indexOf("@"+myName) >= 0;
  addLocalMsg(topic, {id:m.id, sender, name:m.title||"对方", text:parsed.text, quote:parsed.quote, time:(m.time||Date.now()/1000), self:false, mentioned}, {silentUnread:false});
}

// 撤回：用灰色系统提示「X 撤回了一条消息」替换原消息（微信式），而非直接删除
function recallMessage(topic, msgId){
  const msgs = getMsgs(topic);
  const chat=getChat(topic);
  const idx = msgs.findIndex(x=>x.id===msgId);
  if(idx<0){
    // 本地无此消息（如离线时发来又撤回）：末尾补一条系统提示
    if(chat){ const line={id:"rec-"+msgId, sender:"", name:"", text:"对方撤回了一条消息", type:"sysrec", time:Date.now()/1000, self:false}; msgs.push(line); setMsgs(topic, msgs); if(topic===activeTopic){ appendBubble(line); scrollBottom(); } renderChats(); }
    return;
  }
  const m = msgs[idx];
  const who = m.self ? "你" : (m.name||"对方");
  const line = {id:m.id, sender:"", name:"", text: who+" 撤回了一条消息", type:"sysrec", time:m.time, self:false};
  msgs[idx] = line;
  setMsgs(topic, msgs);
  if(chat){
    const last = msgs[msgs.length-1];
    chat.lastMsg = last ? (last.type==="sysrec" ? last.text : ((last.self?"":last.name+": ")+last.text)) : "";
    chat.lastTime = last ? last.time : 0;
    saveChats();
  }
  if(topic===activeTopic) renderChatFull(topic);
  renderChats();
}

let typingHideTimer=null;
function showTyping(topic, name){
  if(topic!==activeTopic) return;
  const bar=$("typingBar"); if($("typingName")) $("typingName").textContent=name||"对方";
  bar.classList.add("show");
  clearTimeout(typingHideTimer);
  typingHideTimer=setTimeout(()=>bar.classList.remove("show"), 4000);
}

function dedupeSubs(arr){
  const seen={}; const out=[];
  arr.forEach(s=>{ if(s&&s.endpoint&&!seen[s.endpoint]){ seen[s.endpoint]=1; out.push(s);} });
  return out;
}

// ---------- 消息写入 ----------
function addLocalMsg(topic, msg, opts){
  opts=opts||{};
  const msgs=getMsgs(topic);
  if(msgs.some(x=>x.id===msg.id)) return;
  msgs.push(msg);
  if(msgs.length>500) msgs.splice(0, msgs.length-500);
  setMsgs(topic, msgs);

  const chat=getChat(topic);
  if(chat){
    chat.lastMsg = (msg.type==="pat") ? msg.text : (msg.merge ? ((msg.self?"":msg.name+": ")+"[聊天记录]") : ((msg.self?"":msg.name+": ")+msg.text));
    chat.lastTime = msg.time;
    const visibleNow = (topic===activeTopic && !document.hidden);
    if(!opts.silentUnread && !visibleNow) chat.unread=(chat.unread||0)+1;
    if(!msg.self && msg.mentioned && !visibleNow) chat.atMe=true;
    chat.order=Date.now();
    saveChats();
  }
  if(topic===activeTopic){
    appendBubble(msg);
    if(atBottom){ scrollBottom(); if(!msg.self && !document.hidden) maybeSendRead(topic); }
    else if(!msg.self){ newCount++; updateJumpBadge(); }
  }
  renderChats();
  updateTabBadge();
  // 后台通知：APK 内由原生层统一弹系统通知，避免重复；浏览器 PWA 用 Web Notification；免打扰不通知
  if(topic!==activeTopic && document.hidden && typeof AndroidBridge==="undefined" && !(chat && chat.mute)){
    notify(myName||"家聊", (msg.name||"")+": "+(msg.text||""));
  }
}

async function sendMessage(topic, text, quote){
  text=(text||"").trim(); if(!text) return;
  const name = myName || "我";
  const id = "local-"+Date.now()+"-"+Math.random().toString(36).slice(2,6);
  const body = embedQuote(text, quote);
  addLocalMsg(topic, {id, sender:uid, name, text, quote:quote||null, time:Date.now()/1000, self:true, status:"sending"}, {silentUnread:true});
  try{
    await fetch(BASE+"/"+topic, {method:"POST", headers:{ "Title":name, "Tags":uid, "Priority":"3" }, body:body});
    updateMsgStatus(topic, id, "delivered");
    // 给在线订阅者推 Web Push（页面关闭也能收）
    const subs = lsGet("fc_subs_"+topic, []);
    for(const s of subs){ if(window.FC_PUSH) FC_PUSH.sendPush(s, {title:name, body:text}).catch(()=>{}); }
  }catch(e){ updateMsgStatus(topic, id, "failed"); toast("发送失败，点击重发"); }
}

function updateMsgStatus(topic, id, status){
  const msgs=getMsgs(topic); const m=msgs.find(x=>x.id===id);
  if(!m) return; m.status=status; setMsgs(topic, msgs);
  if(topic===activeTopic) renderChatFull(topic);
}
function retrySend(topic, id){
  const msgs=getMsgs(topic); const m=msgs.find(x=>x.id===id); if(!m) return;
  updateMsgStatus(topic, id, "sending");
  fetch(BASE+"/"+topic, {method:"POST", headers:{ "Title":myName||"我", "Tags":uid, "Priority":"3" }, body:m.text})
    .then(()=>updateMsgStatus(topic, id, "delivered"))
    .catch(()=>updateMsgStatus(topic, id, "failed"));
}

// ---------- 渲染：会话列表 ----------
let searchKw = "";
function renderChats(){
  const box=$("chatList"); box.innerHTML="";
  let list = chats.slice().sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || b.order-a.order);
  if(searchKw){ const k=searchKw.toLowerCase(); list=list.filter(c=>c.name.toLowerCase().includes(k)); }
  if(list.length===0){
    const e=document.createElement("div"); e.className="empty";
    e.innerHTML = '<div class="big">💬</div><div>还没有聊天</div>';
    const b=document.createElement("button"); b.className="btn"; b.textContent="发起聊天";
    b.onclick=openAddDialog; e.appendChild(b); box.appendChild(e); return;
  }
  list.forEach(c=>{
    const it=document.createElement("div"); it.className="item";
    const av=document.createElement("div"); av.className="avatar"; av.style.background=c.color; av.textContent=avatarText(c.name);
    const mid=document.createElement("div"); mid.className="mid";
    const nm=document.createElement("div"); nm.className="name"; nm.textContent=c.name + (c.atMe?" ［有人@我］":"") + (c.mute?" 🔕":"") + (c.pinned?" 📌":"");
    const pv=document.createElement("div"); pv.className="preview"; pv.textContent=c.lastMsg||"";
    mid.appendChild(nm); mid.appendChild(pv);
    const rc=document.createElement("div"); rc.className="rightcol";
    if(c.lastTime){ const tm=document.createElement("div"); tm.className="time"; tm.textContent=fmtTime(c.lastTime); rc.appendChild(tm); }
    if(c.unread>0){ const bd=document.createElement("div"); bd.className="badge"; bd.textContent=c.unread>99?"99+":c.unread; rc.appendChild(bd); }
    it.appendChild(av); it.appendChild(mid); it.appendChild(rc);
    it.onclick=()=>openChat(c.topic);
    attachLongPress(it, ()=>showChatMenu(c));
    box.appendChild(it);
  });
}

// 会话长按菜单：置顶 / 免打扰 / 重命名 / 删除
function showChatMenu(c){
  openSheet([
    {label: c.pinned ? "取消置顶" : "置顶聊天", fn:()=>{ c.pinned=!c.pinned; saveChats(); renderChats(); toast(c.pinned?"已置顶":"已取消置顶"); if(activeTopic===c.topic) renderChatFull(c.topic); }},
    {label: c.mute ? "允许消息通知" : "消息免打扰", fn:()=>{ c.mute=!c.mute; saveChats(); syncNative(); renderChats(); toast(c.mute?"已免打扰":"已开启通知"); }},
    {label:"修改名称", fn:()=>renameChat(c)},
    {label:"删除会话", danger:true, fn:()=>confirmDialog("删除会话","将从列表中移除「"+c.name+"」（服务器消息仍在），确定？",()=>{ deleteChat(c.topic); })},
  ]);
}

// ---------- 渲染：通讯录 ----------
function renderContacts(){
  const box=$("contactsList"); box.innerHTML="";
  if(chats.length===0){
    box.innerHTML='<div class="empty"><div class="big">👥</div><div>通讯录为空</div></div>'; return;
  }
  const g=document.createElement("div"); g.className="group-title"; g.textContent="聊天 ("+chats.length+")"; box.appendChild(g);
  chats.forEach(c=>{
    const it=document.createElement("div"); it.className="item";
    const av=document.createElement("div"); av.className="avatar"; av.style.background=c.color; av.textContent=avatarText(c.name);
    const mid=document.createElement("div"); mid.className="mid";
    const nm=document.createElement("div"); nm.className="name"; nm.textContent=c.name;
    mid.appendChild(nm);
    it.appendChild(av); it.appendChild(mid);
    it.onclick=()=>openChat(c.topic);
    box.appendChild(it);
  });
  // 添加入口
  const add=document.createElement("div"); add.className="item";
  add.innerHTML='<div class="avatar" style="background:#07C160">+</div><div class="mid"><div class="name">新的聊天</div></div>';
  add.onclick=openAddDialog; box.appendChild(add);
}

// ---------- 渲染：聊天详情 ----------
let activeTopic = null;
function openChat(topic){
  const c=getChat(topic); if(!c) return;
  activeTopic=topic;
  const hadUnread = c.unread>0;
  c.unread=0; c.atMe=false; saveChats(); renderChats(); updateTabBadge();
  replyingTo=null; hideQuoteBar();
  newCount=0; updateJumpBadge(); const jb2=$("jumpLatest"); if(jb2) jb2.classList.remove("show"); atBottom=true;
  searchInChat=""; renderSearchBanner();
  $("chatTitle").textContent = c.name;
  renderPin();
  newMsgFrom = c.lastSeen||0;
  showNewDivider = hadUnread && newMsgFrom>0;
  renderChatFull(topic);
  const _lm=getMsgs(topic); const _lastm=_lm[_lm.length-1]; c.lastSeen = _lastm?_lastm.time:Date.now()/1000; saveChats();
  showScreen("chatScreen");
  $("text").disabled=false; $("sendBtn").disabled=false;

function highlightAt(html){

// 引用回复：用 \u0001Q<json>\u0001 包裹在消息体里，便于跨端还原
function parseQuote(body){
  if(body && body.length>3 && body.charCodeAt(0)===1 && body.charAt(1)==="Q"){
    const end=body.indexOf("\u0001",2);
    if(end>2){ try{ const q=JSON.parse(body.slice(2,end)); return {text:body.slice(end+1), quote:q}; }catch(e){} }
  }
  return {text:body, quote:null};
}
function embedQuote(body, quote){
  if(!quote) return body;
  return "\u0001Q"+JSON.stringify({i:quote.id||"", n:quote.name||"", t:quote.text||""})+"\u0001"+body;
}
// 合并转发：\u0001M<json>\u0001 包裹消息数组
function parseMerge(body){
  if(body && body.length>3 && body.charCodeAt(0)===1 && body.charAt(1)==="M"){
    const end=body.indexOf("\u0001",2);
    if(end>2){ try{ return {ok:true, items:JSON.parse(body.slice(2,end))}; }catch(e){} }
  }
  return {ok:false};
}

// 长按（触摸/鼠标）触发回调
function attachLongPress(el, cb){
  let timer=null;
  const start=()=>{ timer=setTimeout(()=>{ timer=null; cb(); }, 480); };
  const cancel=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener("contextmenu",(e)=>{ e.preventDefault(); cb(); });
  el.addEventListener("touchstart",start,{passive:true});
  el.addEventListener("touchend",cancel);
  el.addEventListener("touchmove",cancel);
  el.addEventListener("touchcancel",cancel);
  el.addEventListener("mousedown",start);
  el.addEventListener("mouseup",cancel);
  el.addEventListener("mouseleave",cancel);
}

function showAtPicker(names, ta){
  atPickerNames=names; const pop=$("atPop"); pop.innerHTML="";
  names.forEach(n=>{ const d=document.createElement("div"); d.textContent=n; d.onclick=()=>insertAtName(n, ta); pop.appendChild(d); });
  pop.classList.add("show");
}
function hideAtPicker(){ const pop=$("atPop"); if(pop) pop.classList.remove("show"); }
function insertAtName(name, ta){
  const pos=ta.selectionStart||ta.value.length;
  const before=ta.value.slice(0,pos);
  const after=ta.value.slice(pos);
  const m=before.match(/@([^\s@，。、！？,!?]*)$/);
  let start=m? before.length-m[0].length : before.length;
  const nv=before.slice(0,start)+"@"+name+" "+after;
  ta.value=nv;
  const np=start+name.length+2;
  ta.setSelectionRange(np,np);
  ta.focus(); autoGrow(ta); hideAtPicker();
}

function deleteChat(topic){
  chats = chats.filter(c=>c.topic!==topic);
  if(esMap[topic]){ try{esMap[topic].close();}catch(e){} delete esMap[topic]; }
  saveChats(); syncNative(); updateTabBadge();
  activeTopic=null; showScreen("screenChats"); renderChats();
}

// 发起/加入
function openAddDialog(){
  openSheet([
    {label:"发起新聊天", fn:()=>createChat()},
    {label:"加入已有聊天", fn:()=>joinChat()},
  ]);
}
function createChat(){
  promptDialog("发起新聊天","给这个聊天起个名字（如：家庭群聊）","",(name)=>{
    name=(name||"").trim()||"新聊天";
    const topic = "fc"+Math.random().toString(36).slice(2,12);
    const c=mkChat(name, topic); chats.unshift(c); saveChats(); syncNative();
    connectTopic(topic); renderChats(); updateTabBadge();
    showInvite(c);
  });
}
function joinChat(){
  promptDialog("加入聊天","输入家人分享的「邀请码」或「邀请链接」：","",(code)=>{
    code=(code||"").trim(); if(!code) return;
    // 支持直接粘贴链接，提取 ?invite=
    const m=code.match(/invite=([^&\s]+)/); if(m) code=m[1];
    code=code.replace(/[^a-zA-Z0-9_-]/g,"");
    if(!code) { toast("邀请码无效"); return; }
    if(chats.some(c=>c.topic===code)){ toast("已在列表中"); openChat(code); return; }
    const c=mkChat("家人", code); chats.unshift(c); saveChats(); syncNative();
    connectTopic(code); loadHistory(code); renderChats(); updateTabBadge();
    setTimeout(()=>openChat(code),300);
  }, true);
}
function showInvite(c){
  const link = (location.protocol.indexOf("http")===0 ? location.origin+location.pathname : "https://15816563131.github.io/family-chat-app/") + "?invite=" + c.topic;
  dialogCard(`
    <div class="ct">邀请家人加入</div>
    <div class="cb">把下面任一项发给家人，他们即可加入「${escapeHtml(c.name)}」</div>
    <div class="codebox" id="invCode">${escapeHtml(c.topic)}</div>
    <div class="linkbox" id="invLink">${escapeHtml(link)}</div>
    <div class="cactions"><button class="ghost" id="dCopyCode">复制邀请码</button><button id="dCopyLink">复制邀请链接</button></div>
  `);
  $("dCopyCode").onclick=()=>copyText(c.topic,"邀请码已复制");
  $("dCopyLink").onclick=()=>copyText(link,"邀请链接已复制");
}
function renameChat(c){
  promptDialog("修改名称","聊天显示名称：",c.name,(name)=>{
    name=(name||"").trim(); if(!name) return;
    c.name=name; saveChats(); syncNative();
    if(activeTopic===c.topic) $("chatTitle").textContent=name;
    renderChats(); renderContacts();
  });
}

// 深色模式
let darkMode = localStorage.getItem("fc_dark") || "auto"; // auto | on | off
function applyTheme(){
  let t = darkMode;
  if(t==="auto"){ try{ t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "on" : "off"; }catch(e){ t="off"; } }
  if(t==="on") document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
  const map={auto:"跟随系统",on:"已开启",off:"已关闭"};
  const dv=$("darkV"); if(dv) dv.textContent=map[darkMode]||"跟随系统";
  try{ if(window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(darkMode==="auto") applyTheme(); }); }catch(e){}
}

// ---------- 通用弹窗 ----------
function openSheet(opts){
  const s=$("sheet"); s.innerHTML="";
  opts.forEach(o=>{ const d=document.createElement("div"); d.className="opt"+(o.danger?" danger":""); d.textContent=o.label; d.onclick=()=>{ closeSheet(); o.fn&&o.fn(); }; s.appendChild(d); });
  const cancel=document.createElement("div"); cancel.className="cancel"; cancel.textContent="取消"; cancel.onclick=closeSheet; s.appendChild(cancel);
  $("sheetMask").classList.add("show");
}
function closeSheet(){ $("sheetMask").classList.remove("show"); }
$("sheetMask").onclick=(e)=>{ if(e.target===$("sheetMask")) closeSheet(); };

function dialogCard(html){ $("dialogCard").innerHTML=html; $("dialog").classList.add("show"); }
function closeDialog(){ $("dialog").classList.remove("show"); }
function promptDialog(title, desc, def, cb, multiline){
  dialogCard(`<div class="ct">${escapeHtml(title)}</div><div class="cb">${escapeHtml(desc)}</div><input id="dInput" value="${escapeHtml(def||"")}" placeholder=""><div class="cactions"><button class="ghost" id="dCancel">取消</button><button id="dOk">确定</button></div>`);
  const inp=$("dInput"); setTimeout(()=>inp.focus(),50);
  $("dCancel").onclick=closeDialog;
  $("dOk").onclick=()=>{ const v=inp.value; closeDialog(); cb&&cb(v); };
  inp.onkeydown=(e)=>{ if(e.key==="Enter"){ const v=inp.value; closeDialog(); cb&&cb(v); } };
}
function confirmDialog(title, desc, cb){
  dialogCard(`<div class="ct">${escapeHtml(title)}</div><div class="cb">${escapeHtml(desc)}</div><div class="cactions"><button class="ghost" id="dCancel">取消</button><button id="dOk" style="color:var(--wx-red)">确定</button></div>`);
  $("dCancel").onclick=closeDialog;
  $("dOk").onclick=()=>{ closeDialog(); cb&&cb(); };
}
$("dialog").onclick=(e)=>{ if(e.target===$("dialog")) closeDialog(); };

function copyText(text, okMsg){
  const done=()=>toast(okMsg||"已复制");
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done)); }
  else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("复制失败，请手动复制"); }
  document.body.removeChild(ta);
}

// ---------- 邀请链接自动加入 ----------
function checkInvite(){
  try{
    const u=new URL(location.href); const inv=u.searchParams.get("invite");
    if(inv && !chats.some(c=>c.topic===inv)){
      const c=mkChat("家人", inv); chats.unshift(c); saveChats(); syncNative();
      connectTopic(inv); loadHistory(inv); renderChats();
      toast("已通过邀请码加入聊天");
    }
  }catch(e){}
}

// ---------- 启动 ----------
function boot(){
  buildEmoji();
  // 首次设置昵称
  if(!myName){ promptDialog("欢迎使用家聊","先设置一个昵称，家人会看到它：","家人",(n)=>{ myName=(n||"").trim()||"家人"; localStorage.setItem("fc_name",myName); renderMe(); afterName(); }); }
  else afterName();
}
function afterName(){
  $("splash").style.display="none";
  checkInvite();
  applyTheme();
  applyFont();
  applyBg();
  renderChats(); renderMe(); updateTabBadge();
  const mb=$("messages"); if(mb) mb.addEventListener("scroll", onMsgScroll);
  connectAll(); syncNative();
  // 通知权限
  if("Notification" in window && Notification.permission==="default") Notification.requestPermission().then(p=>{ const v=$("notifV"); if(v) v.textContent=(p==="granted"?"开启":"已关闭"); });
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  // 周期性重新拉取历史（SSE 断线兜底）
  setInterval(()=>{ if(document.visibilityState==="visible"){ chats.forEach(c=>loadHistory(c.topic)); } }, 30000);
  // 周期性广播自己的 Web Push 订阅（便于其他浏览器端推送）
  setInterval(()=>{ chats.forEach(c=>shareSubscription(c.topic)); }, 60000);
  // 页面显隐时刷新未读
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) renderChats(); });
  // 进入后台时通知原生
  if(typeof AndroidBridge!=="undefined"){ window.notifyAppBackground=()=>{ try{AndroidBridge.notifyBackground&&AndroidBridge.notifyBackground();}catch(e){} }; window.notifyAppForeground=()=>{ try{AndroidBridge.notifyForeground&&AndroidBridge.notifyForeground();}catch(e){} }; }
}
boot();
</script>
