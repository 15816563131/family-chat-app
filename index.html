}
function joinChat(){
  promptDialog("加入聊天","输入家人分享的「邀请码」或「邀请链接」：","",(code)=>{
    code=(code||"").trim(); if(!code) return;
    // 支持直接粘贴链接，提取 ?invite=
    const m=code.match(/invite=([^&\s]+)/); if(m) code=m[1];
    code=code.replace(/[^a-zA-Z0-9_-]/g,"");
    if(!code) { toast("邀请码无效"); return; }
    if(chats.some(c=>c.topic===code)){ toast("已在列表中"); openChat(code); return; }
    const c=mkChat("家人", code); chats.unshift(c); saveChats(); syncNative();
    if(code.indexOf("fg")===0){ c.type="group"; c.members=[{uid:uid, name:myName||"我"}]; }
    connectTopic(code); loadHistory(code); renderChats(); updateTabBadge();
    setTimeout(()=>openChat(code),300);
  }, true);
}
function showInvite(c){
  const link = (location.protocol.indexOf("http")===0 ? location.origin+location.pathname : "https://15816563131.github.io/family-chat-app/") + "?invite=" + c.topic;
  dialogCard(`
    <div class="ct">邀请家人加入</div>
    <div class="cb">把下面任一项发给家人，他们即可加入「${escapeHtml(c.name)}」</div>
    <div class="codebox" id="invCode">${escapeHtml(c.topic)}</div>
    <div class="linkbox" id="invLink">${escapeHtml(link)}</div>
    <div class="cactions"><button class="ghost" id="dCopyCode">复制邀请码</button><button id="dCopyLink">复制邀请链接</button></div>
  `);
  $("dCopyCode").onclick=()=>copyText(c.topic,"邀请码已复制");
  $("dCopyLink").onclick=()=>copyText(link,"邀请链接已复制");
}

// ---------- 群信息 / 成员管理 ----------
function openGroupInfo(c){
  if(!c || c.type!=="group") return;
  const s=$("sheet"); s.innerHTML = buildGroupInfoHTML(c);
  bindGroupInfo(c, s);
  $("sheetMask").classList.add("show");
}
function closeGroupInfo(){ $("sheetMask").classList.remove("show"); }
function buildGroupInfoHTML(c){
  const mems = c.members || [];
  const rows = mems.map(m=>{
    const nm = escapeHtml(m.name||"成员");
    const uidStr = escapeHtml(m.uid||"");
    const ch = ((m.name||m.uid||"?").trim().charAt(0)||"?").toUpperCase();
    const bg = colorFrom(m.uid||m.name||"x");
    const isSelf = m.uid===uid;
    return `<div class="gi-row" data-uid="${uidStr}">
      <div class="gi-av" style="background:${bg}">${escapeHtml(ch)}</div>
      <div class="gi-info"><div class="gi-mname">${nm}${isSelf?'（我）':''}</div><div class="gi-muid">家聊号 ${uidStr}</div></div>
      ${isSelf?'':`<div class="gi-kick" data-act="kick">移除</div>`}
    </div>`;
  }).join("");
  return `
    <div class="gi">
      <div class="gi-head">
        <div class="gi-name" id="giName">${escapeHtml(c.name)}</div>
        <div class="gi-edit" id="giEdit">✎ 编辑</div>
      </div>
      <div class="gi-sec">成员 ${mems.length} 人</div>
      <div class="gi-members">${rows||'<div class="gi-row"><div class="gi-info"><div class="gi-mname">暂无成员</div></div></div>'}</div>
      <div class="gi-act"><button id="giInvite">+ 邀请家人加入</button></div>
      <div class="gi-leave" id="giLeave">退出群聊</div>
      <div class="gi-close" id="giClose">关闭</div>
    </div>`;
}
function bindGroupInfo(c, root){
  if($("giEdit",root)) $("giEdit",root).onclick=()=>{
    promptDialog("修改群名称","给群聊起个新名字", c.name, (nn)=>{
      nn=(nn||"").trim(); if(!nn || nn===c.name) return;
      const old=c.name; c.name=nn; saveChats(); renderChats();
      if(activeTopic===c.topic) $("chatTitle").textContent = c.name+"（"+(c.members?c.members.length:1)+"）";
      sendGroupCtrl(c.topic, "rename", encTitle(nn));
      addLocalMsg(c.topic, {id:"sysr-"+Date.now(), sender:uid, name:"", text:`「${old}」改名为「${nn}」`, type:"sysrec", time:Date.now()/1000, self:false});
    });
  };
  if($("giInvite",root)) $("giInvite",root).onclick=()=>{ closeGroupInfo(); showInvite(c); };
  if($("giLeave",root)) $("giLeave",root).onclick=()=>{
    confirmDialog("退出群聊","确定要退出「"+c.name+"」吗？退出后将不再接收该群消息。",()=>{
      sendGroupCtrl(c.topic, "leave", uid);
      deleteChat(c.topic);
    });
  };
  if($("giClose",root)) $("giClose",root).onclick=closeGroupInfo;
  root.querySelectorAll('[data-act="kick"]').forEach(el=>{
    el.onclick=()=>{
      const tuid = el.parentElement.dataset.uid;
      const m = (c.members||[]).find(x=>x.uid===tuid);
      const mn = m?(m.name||"成员"):"该成员";

function bytesToB64(bytes){ let s=""; for(let i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s); }
function b64ToBytes(b64){ const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
const _SUBTLE = !!(window.crypto && crypto.subtle);
async function deriveKey(pw, salt){
  const enc=new TextEncoder();
  const mat=await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:100000, hash:"SHA-256"}, mat, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptObj(obj, pw){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await deriveKey(pw, salt);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return {app:"family-chat", v:1, enc:true, ts:Date.now(), salt:bytesToB64(salt), iv:bytesToB64(iv), ct:bytesToB64(new Uint8Array(ct))};
}
async function decryptObj(env, pw){
  const salt=b64ToBytes(env.salt), iv=b64ToBytes(env.iv), ct=b64ToBytes(env.ct);
  const key=await deriveKey(pw, salt);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function gatherAllData(){

    chats:lsGet("fc_chats",[]), msgs, favs:lsGet("fc_favs",[]),
    settings:{ fc_name:k("fc_name"), fc_uid:k("fc_uid"), fc_dark:k("fc_dark"), fc_font:k("fc_font"), fc_bg:k("fc_bg"), fc_recent_emoji:JSON.stringify(lsGet("fc_recent_emoji",[])), fc_stickers:JSON.stringify(lsGet("fc_stickers",[])) }
  };
}

  }catch(e){}
}

$("backupFile").onchange=(e)=>{
  if(!_SUBTLE){ toast("当前环境不支持解密，请用网页版恢复备份"); return; }
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let env; try{ env=JSON.parse(r.result); }catch(err){ toast("文件无法解析"); return; }
    const doRestore=(pw)=>{
      decryptObj(env, pw||"family-chat-default-backup-key").then(d=>{
        confirmDialog("恢复备份","将用备份覆盖本机当前所有聊天与账号数据，确定？",()=>{
          lsSet("fc_accounts", d.accounts||[]);

          lsSet("fc_chats", d.chats||[]);
          lsSet("fc_favs", d.favs||[]);
          if(d.settings){ for(const key in d.settings){ const v=d.settings[key]; if(v===null||v===undefined) localStorage.removeItem(key); else localStorage.setItem(key, v); } }
          if(d.msgs){ for(const t in d.msgs){ setMsgs(t, d.msgs[t]); } }
          toast("恢复完成，正在重新加载…");
          setTimeout(()=>location.reload(), 800);
        });
      }).catch(()=>toast("密码错误或文件损坏"));
    };
    if(env&&env.enc){ promptDialog("恢复备份","输入备份密码：","",(pw)=>doRestore(pw), false, "password"); }
    else if(env&&!env.enc){ doRestore(""); }
    else { toast("文件格式不正确"); }
  };
  r.readAsText(f);
  e.target.value="";
};

function dialogCard(html){ $("dialogCard").innerHTML=html; $("dialog").classList.add("show"); }
function closeDialog(){ $("dialog").classList.remove("show"); }
function promptDialog(title, desc, def, cb, multiline, type){
  const inputHtml = multiline
    ? `<textarea id="dInput" placeholder="">${escapeHtml(def||"")}</textarea>`
    : `<input id="dInput" type="${type||"text"}" value="${escapeHtml(def||"")}" placeholder="">`;

  const inp=$("dInput"); setTimeout(()=>inp.focus(),50);
  $("dCancel").onclick=closeDialog;
  $("dOk").onclick=()=>{ const v=inp.value; closeDialog(); cb&&cb(v); };
  inp.onkeydown=(e)=>{ if(e.key==="Enter"){ const v=inp.value; closeDialog(); cb&&cb(v); } };
}
function confirmDialog(title, desc, cb){
  dialogCard(`<div class="ct">${escapeHtml(title)}</div><div class="cb">${escapeHtml(desc)}</div><div class="cactions"><button class="ghost" id="dCancel">取消</button><button id="dOk" style="color:var(--wx-red)">确定</button></div>`);

  $("dOk").onclick=()=>{ closeDialog(); cb&&cb(); };
}

function copyText(text, okMsg){
  const done=()=>toast(okMsg||"已复制");
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done)); }
  else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast("复制失败，请手动复制"); }
  document.body.removeChild(ta);
}

// ---------- 启动 ----------
function boot(){
  try{
    $("splash").style.display="none"; // 立即隐藏加载页，避免被弹窗遮挡造成「卡加载」
    buildEmoji();

  }catch(e){
    console.error("boot error:", e);
    const s=document.getElementById("splash"); if(s) s.style.display="none";
    toast("初始化出错："+(e&&e.message||e));
  }
}
// 兜底：无论如何 6 秒后强制隐藏加载页，避免任何异常导致永久卡在「加载中」
setTimeout(()=>{ try{ const s=document.getElementById("splash"); if(s) s.style.display="none"; }catch(e){} }, 6000);
let appBooted=false;
function afterName(){
  $("splash").style.display="none";
  checkInvite();
  applyTheme();
  applyFont();
  applyBg();
  renderChats(); renderMe(); updateTabBadge();
  const mb=$("messages"); if(mb && !appBooted) mb.addEventListener("scroll", onMsgScroll);
  // 点击群名 → 群信息/成员管理
  $("chatTitle").onclick=()=>{ const c=getChat(activeTopic); if(c && c.type==="group") openGroupInfo(c); };
  connectAll(); syncNative();
  if(!appBooted){
    appBooted=true;
    // 通知权限（用于 Web 端系统通知 / Web Push）
    if("Notification" in window && Notification.permission==="default") Notification.requestPermission().then(p=>{ const v=$("notifV"); if(v) v.textContent = lsGet("fc_cue", true) ? "开启":"已关闭"; }).catch(()=>{});
    if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
    // 解锁音频上下文（浏览器自动播放策略要求用户手势后才能发声）
    ["click","touchstart","keydown"].forEach(ev=>document.addEventListener(ev, _unlockAudio, {passive:true, once:true}));
    // 周期性历史兜底：SSE 正常时实时收消息，无需拉历史；仅断线时或每 5 分钟轻量兜底一次，避免持续刷 ntfy 触发 429
    let lastHistCatchup = 0;
    setInterval(()=>{
      if(document.visibilityState!=="visible") return;
      const now = Date.now();
      if(esAlive && now - lastHistCatchup < 300000) return; // SSE 活着且 5 分钟内已兜底过 → 跳过
      lastHistCatchup = now;
      chats.forEach((c,i)=> setTimeout(()=>loadHistory(c.topic), i*700));
    }, 60000);
    // 周期性广播自己的 Web Push 订阅（便于其他浏览器端推送）；shareSubscription 内部已做 10 分钟节流
    setInterval(()=>{ chats.forEach(c=>shareSubscription(c.topic)); }, 300000);
    // 页面显隐时刷新未读
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) renderChats(); });
    // 进入后台时通知原生
    if(typeof AndroidBridge!=="undefined"){ window.notifyAppBackground=()=>{ try{AndroidBridge.notifyBackground&&AndroidBridge.notifyBackground();}catch(e){} }; window.notifyAppForeground=()=>{ try{AndroidBridge.notifyForeground&&AndroidBridge.notifyForeground();}catch(e){} }; }
    // 周期检查消息提醒（纯本地）
    checkReminders(); setInterval(checkReminders, 30000);
  }
}
boot();
